[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "go-review-ai"
version = "0.1.0"
description = "Go review prototype with validated SGF and manual game input."
requires-python = ">=3.11"
dependencies = ["sgfmill==1.1.1"]

[project.optional-dependencies]
api = [
    "fastapi==0.135.1",
    "pydantic==2.12.5",
    "python-multipart==0.0.22",
    "uvicorn==0.41.0",
]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
]

[tool.setuptools]
packages = ["src", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
