<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>围棋复盘 MVP 演示</title>
  <style>
    :root {
      --page-gutter: 20px;
      --surface: rgba(255, 251, 244, 0.96);
      --surface-border: #d8cfbf;
      --shadow-soft: 0 18px 40px rgba(84, 67, 39, 0.08);
    }

    html {
      min-height: 100%;
      background: linear-gradient(180deg, #f4efe6 0%, #fbf8f2 100%);
    }

    body {
      font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: var(--page-gutter);
      max-width: 1440px;
      min-height: 100vh;
      box-sizing: border-box;
      line-height: 1.4;
      color: #2f2920;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 22px;
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(360px, 420px);
      gap: 20px;
      align-items: start;
    }

    .board-column {
      display: grid;
      gap: 12px;
      min-width: 0;
    }

    #board {
      width: min(100%, 640px);
      aspect-ratio: 1 / 1;
      border: 1px solid #b79254;
      border-radius: 18px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #e7c98b, #d7ad63);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 36px rgba(115, 81, 28, 0.18);
    }

    #board canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 10px;
      border: 1px solid #999;
      border-radius: 10px;
      background: #f7f3ea;
      cursor: pointer;
    }

    button:hover {
      background: #ececec;
    }

    button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .panel {
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      padding: 14px 16px;
      min-height: 200px;
      min-width: 0;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      box-sizing: border-box;
    }

    .upload-controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .upload-controls input[type="file"] {
      max-width: 100%;
    }

    .meta {
      font-size: 13px;
      color: #333;
    }

    .board-meta {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border: 1px solid var(--surface-border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .review-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .review-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #efe4c6;
      color: #6b4c1c;
      font-size: 12px;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
    }

    .analysis-section {
      margin-top: 12px;
    }

    .analysis-section strong {
      display: block;
      margin-bottom: 4px;
    }

    .analysis-section ul {
      margin: 4px 0 0 18px;
      padding: 0;
    }

    .analysis-section li {
      margin: 2px 0;
    }

    .view-switch {
      display: flex;
      gap: 8px;
      margin: 10px 0 12px;
      flex-wrap: wrap;
    }

    .view-switch button {
      border-radius: 999px;
      background: #f2efe6;
    }

    .view-switch button.active {
      border-color: #8f5f1e;
      background: #ead19e;
      color: #5c3d12;
    }

    .section-note {
      margin-top: 4px;
      font-size: 12px;
      color: #666;
    }

    .review-item-button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d7c49b;
      border-radius: 8px;
      background: #fff9ec;
      text-align: left;
      line-height: 1.45;
    }

    .review-item-button:hover {
      background: #f7edd5;
    }

    .review-item-button.active {
      border-color: #8f5f1e;
      background: #f2dfb5;
    }

    .review-item-meta {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #6d5a39;
    }

    .candidate-choice-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .candidate-choice-button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cfd8c7;
      border-radius: 8px;
      background: #f6faf4;
      text-align: left;
      line-height: 1.4;
    }

    .candidate-choice-button:hover {
      background: #eef6ea;
    }

    .candidate-choice-button.active {
      border-color: #1f7a3d;
      background: #e2f0e5;
      box-shadow: inset 0 0 0 1px rgba(31, 122, 61, 0.2);
    }

    .candidate-choice-rank {
      display: inline-block;
      margin-bottom: 3px;
      padding: 1px 8px;
      border-radius: 999px;
      background: #ddebdc;
      color: #245a2f;
      font-size: 12px;
    }

    .candidate-choice-button.active .candidate-choice-rank {
      background: #1f7a3d;
      color: #fff;
    }

    .candidate-choice-meta {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #52624f;
    }

    .candidate-detail-panel {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #d7e3d5;
      border-radius: 10px;
      background: #f8fcf7;
    }

    .candidate-detail-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .candidate-detail-title strong {
      margin: 0;
    }

    .candidate-rank-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1f7a3d;
      color: #fff;
      font-size: 12px;
    }

    .candidate-detail-panel p {
      margin: 6px 0 0;
    }

    .chart-controls {
      display: flex;
      gap: 8px;
      margin: 6px 0 8px;
      flex-wrap: wrap;
    }

    .chart-controls button {
      padding: 4px 8px;
      font-size: 12px;
    }

    .chart-controls button.active {
      background: #ddd;
    }

    .trend-chart {
      border: 1px solid #ccc;
      background: #fff;
      padding: 6px;
    }

    .trend-chart svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .chart-meta {
      margin-top: 6px;
      font-size: 12px;
      color: #555;
    }

    .chart-note {
      margin-top: 4px;
      font-size: 12px;
      color: #666;
    }

    .loading-state {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      color: #333;
    }

    .loading-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #d9d9d9;
      border-top-color: #666;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex: 0 0 auto;
    }

    .loading-text {
      font-size: 14px;
    }

    .error-message {
      color: #b00020;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    details {
      margin-top: 12px;
    }

    summary {
      cursor: pointer;
    }

    @media (min-width: 901px) {
      .board-column {
        position: sticky;
        top: var(--page-gutter);
        max-height: calc(100vh - (var(--page-gutter) * 2));
        overflow: auto;
        padding-right: 4px;
      }

      .panel {
        max-height: calc(100vh - (var(--page-gutter) * 2));
        overflow: auto;
      }
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      #board {
        width: min(100%, 560px);
      }
    }
  </style>
</head>
<body>
  <!--
    How to run:
    1) Start your FastAPI backend so /api/v1/analyze-moves is available.
       Example (from backend project root): uvicorn app.main:app --reload
    2) Open this file in a browser.
       If direct file:// requests are blocked by your browser for API calls,
       serve this folder with a tiny static server instead, e.g.:
       python3 -m http.server 8080
       then open http://localhost:8080
  -->

  <h1>围棋复盘 MVP - 棋盘演示</h1>

  <div class="layout">
    <div class="board-column">
      <div id="board">
        <canvas id="boardCanvas" aria-label="围棋棋盘"></canvas>
      </div>

      <div class="controls">
        <button id="undoBtn" type="button">悔棋</button>
        <button id="clearBtn" type="button">清空棋盘</button>
        <button id="analyzeBtn" type="button">开始分析</button>
        <button id="latestBtn" type="button" disabled>回到最新局面</button>
      </div>

      <div class="upload-controls">
        <input id="sgfFileInput" type="file" accept=".sgf,application/x-go-sgf,text/plain" aria-label="选择 SGF 文件" />
        <button id="uploadAnalyzeBtn" type="button">上传并分析</button>
      </div>
      <div class="board-meta">
        <div class="meta" id="uploadStatus">也可以直接上传 SGF 文件进行分析。</div>
        <div class="meta" id="status">下一手：黑棋 | 手数：0</div>
        <div class="meta review-meta" id="reviewStatus">
          <span class="review-badge">最新局面</span>
          <span>当前未查看具体复盘手数。</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <strong>分析结果</strong>
      <div class="view-switch" id="analysisViewSwitch" aria-label="分析视图切换">
        <button id="currentViewBtn" type="button" class="active" data-analysis-view="current">当前局面</button>
        <button id="reviewViewBtn" type="button" data-analysis-view="review">整盘复盘</button>
      </div>
      <div id="analysisSummary">暂无分析结果。</div>
      <details>
        <summary>6. 原始分析数据</summary>
        <pre id="analysisOutput">暂无分析数据。</pre>
      </details>
    </div>
  </div>

  <script>
    (function () {
      var boardElement = document.getElementById("board");
      var canvas = document.getElementById("boardCanvas");
      var context = canvas.getContext("2d");
      var summary = document.getElementById("analysisSummary");
      var output = document.getElementById("analysisOutput");
      var status = document.getElementById("status");
      var reviewStatus = document.getElementById("reviewStatus");
      var undoBtn = document.getElementById("undoBtn");
      var clearBtn = document.getElementById("clearBtn");
      var analyzeBtn = document.getElementById("analyzeBtn");
      var latestBtn = document.getElementById("latestBtn");
      var sgfFileInput = document.getElementById("sgfFileInput");
      var uploadAnalyzeBtn = document.getElementById("uploadAnalyzeBtn");
      var uploadStatus = document.getElementById("uploadStatus");
      var analysisViewSwitch = document.getElementById("analysisViewSwitch");
      var BOARD_SIZE = 19;
      var SGF_LETTERS = "abcdefghijklmnopqrstuvwxyz";
      var DISPLAY_COLUMNS = "ABCDEFGHJKLMNOPQRST";
      var STAR_POINTS = [3, 9, 15];
      var moves = [];
      var stonesByPoint = {};
      var currentColor = "B";
      var boardMetrics = null;
      var candidateMarkers = [];
      var chartMetric = "winrate";
      var defaultAnalyzeButtonText = "开始分析";
      var analysisData = null;
      var reviewFocus = null;
      var reviewTargets = [];
      var analysisView = "current";
      var selectedCandidateRank = 1;

      function setUploadStatus(message, isError) {
        uploadStatus.textContent = message;
        uploadStatus.classList.toggle("error-message", Boolean(isError));
      }

      function colorName(color) {
        return color === "B" ? "黑棋" : "白棋";
      }

      function toSgf(x, y) {
        return SGF_LETTERS.charAt(x) + SGF_LETTERS.charAt(y);
      }

      function fromSgf(sgf) {
        if (typeof sgf !== "string" || sgf.length !== 2) return null;

        var x = SGF_LETTERS.indexOf(sgf.charAt(0));
        var y = SGF_LETTERS.indexOf(sgf.charAt(1));

        if (x < 0 || y < 0 || x >= BOARD_SIZE || y >= BOARD_SIZE) return null;

        return { x: x, y: y };
      }

      function fromDisplayCoord(display) {
        if (typeof display !== "string") return null;

        var normalized = display.trim().toUpperCase();
        var match = /^([A-HJ-T])\s*(\d{1,2})$/.exec(normalized);
        var x;
        var row;
        var y;

        if (!match) return null;

        x = DISPLAY_COLUMNS.indexOf(match[1]);
        row = Number(match[2]);
        y = BOARD_SIZE - row;

        if (x < 0 || row < 1 || row > BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return null;

        return { x: x, y: y };
      }

      function stoneAt(x, y) {
        return stonesByPoint[pointKey(x, y)] || null;
      }

      function pointKey(x, y) {
        return x + "," + y;
      }

      function oppositeColor(color) {
        return color === "B" ? "W" : "B";
      }

      function neighborsOf(x, y) {
        var neighbors = [];

        if (x > 0) neighbors.push({ x: x - 1, y: y });
        if (x < BOARD_SIZE - 1) neighbors.push({ x: x + 1, y: y });
        if (y > 0) neighbors.push({ x: x, y: y - 1 });
        if (y < BOARD_SIZE - 1) neighbors.push({ x: x, y: y + 1 });

        return neighbors;
      }

      function collectGroup(startX, startY) {
        var startStone = stoneAt(startX, startY);
        var stack;
        var seen;
        var group;
        var liberties;

        if (!startStone) return null;

        stack = [{ x: startX, y: startY }];
        seen = {};
        group = [];
        liberties = {};

        while (stack.length) {
          var point = stack.pop();
          var key = pointKey(point.x, point.y);

          if (seen[key]) continue;
          seen[key] = true;

          var stone = stoneAt(point.x, point.y);
          if (!stone || stone.color !== startStone.color) continue;

          group.push(stone);

          var neighbors = neighborsOf(point.x, point.y);
          for (var i = 0; i < neighbors.length; i++) {
            var neighbor = neighbors[i];
            var neighborStone = stoneAt(neighbor.x, neighbor.y);

            if (!neighborStone) {
              liberties[pointKey(neighbor.x, neighbor.y)] = true;
              continue;
            }

            if (neighborStone.color === startStone.color && !seen[pointKey(neighbor.x, neighbor.y)]) {
              stack.push(neighbor);
            }
          }
        }

        return {
          stones: group,
          libertyCount: Object.keys(liberties).length
        };
      }

      function removeStone(stone) {
        delete stonesByPoint[pointKey(stone.x, stone.y)];
        stone.isCaptured = true;
      }

      function restoreStone(stone) {
        stonesByPoint[pointKey(stone.x, stone.y)] = stone;
        stone.isCaptured = false;
      }

      function tryPlaceMove(point, color) {
        var move;
        var neighbors;
        var capturedStones;
        var seenGroups;

        if (stoneAt(point.x, point.y)) return false;

        move = {
          x: point.x,
          y: point.y,
          color: color,
          sgf: toSgf(point.x, point.y),
          captures: [],
          isCaptured: false
        };
        stonesByPoint[pointKey(point.x, point.y)] = move;

        neighbors = neighborsOf(point.x, point.y);
        capturedStones = [];
        seenGroups = {};

        for (var i = 0; i < neighbors.length; i++) {
          var neighbor = neighbors[i];
          var neighborStone = stoneAt(neighbor.x, neighbor.y);
          var groupInfo;
          var groupKey;
          var j;

          if (!neighborStone || neighborStone.color !== oppositeColor(color)) continue;

          groupKey = pointKey(neighbor.x, neighbor.y);
          if (seenGroups[groupKey]) continue;

          groupInfo = collectGroup(neighbor.x, neighbor.y);
          if (!groupInfo) continue;

          for (j = 0; j < groupInfo.stones.length; j++) {
            seenGroups[pointKey(groupInfo.stones[j].x, groupInfo.stones[j].y)] = true;
          }

          if (groupInfo.libertyCount === 0) {
            for (j = 0; j < groupInfo.stones.length; j++) {
              capturedStones.push(groupInfo.stones[j]);
            }
          }
        }

        for (var k = 0; k < capturedStones.length; k++) {
          removeStone(capturedStones[k]);
        }

        move.captures = capturedStones;

        if (collectGroup(point.x, point.y).libertyCount === 0) {
          delete stonesByPoint[pointKey(point.x, point.y)];
          return false;
        }

        moves.push(move);
        return true;
      }

      function undoLastMove() {
        var move = moves.pop();

        if (!move) return;

        delete stonesByPoint[pointKey(move.x, move.y)];

        for (var i = 0; i < move.captures.length; i++) {
          restoreStone(move.captures[i]);
        }
      }

      function updateStatus() {
        status.textContent = "下一手：" + colorName(currentColor) + " | 手数：" + moves.length;
      }

      function updateReviewStatus() {
        if (!reviewFocus) {
          reviewStatus.innerHTML = [
            "<span class=\"review-badge\">最新局面</span>",
            "<span>当前未查看具体复盘手数。</span>"
          ].join("");
          latestBtn.disabled = true;
          return;
        }

        reviewStatus.innerHTML = [
          "<span class=\"review-badge\">复盘" + escapeHtml(moveRefLabel(reviewFocus.color, reviewFocus.moveNumber)) + "</span>",
          "<span>",
          "实战：" + escapeHtml(formatCoord(reviewFocus.playedMove)) +
          " | 推荐：" + escapeHtml(formatCoord(reviewFocus.recommendedMove)) +
          (reviewFocus.label ? " | " + escapeHtml(reviewFocus.label) : ""),
          "</span>"
        ].join("");
        latestBtn.disabled = false;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatCoord(coord) {
        if (!coord) return "暂无";
        if (typeof coord === "string") return coord;
        if (coord.display) return coord.display;
        if (coord.sgf) return coord.sgf;
        return "暂无";
      }

      function extractCoordPoint(coord) {
        if (!coord) return null;

        if (typeof coord === "string") {
          return fromSgf(coord) || fromDisplayCoord(coord);
        }

        return fromSgf(coord.sgf) || fromDisplayCoord(coord.display);
      }

      function getCurrentCandidateMarkers(data) {
        if (!data || typeof data !== "object") return [];

        var current = data.current_position || {};
        var candidates = Array.isArray(current.top_candidates) ? current.top_candidates.slice(0, 3) : [];

        return candidates
          .map(function (candidate, index) {
            var point = extractCoordPoint(candidate && candidate.move);

            if (!point) return null;

            return {
              x: point.x,
              y: point.y,
              rank: index + 1,
              move: candidate.move
            };
          })
          .filter(Boolean);
      }

      function getCandidateMarkersFromCandidates(candidates) {
        if (!Array.isArray(candidates)) return [];

        return candidates
          .slice(0, 3)
          .map(function (candidate, index) {
            var point = extractCoordPoint(candidate && candidate.move);

            if (!point) return null;

            return {
              x: point.x,
              y: point.y,
              rank: index + 1,
              move: candidate.move
            };
          })
          .filter(Boolean);
      }

      function getActiveCandidates(data) {
        if (!data || typeof data !== "object") return [];

        if (reviewFocus && Array.isArray(reviewFocus.topCandidates)) {
          return reviewFocus.topCandidates.slice(0, 3);
        }

        return data.current_position && Array.isArray(data.current_position.top_candidates)
          ? data.current_position.top_candidates.slice(0, 3)
          : [];
      }

      function candidateRankLabel(rank) {
        if (rank === 1) return "第1选择";
        if (rank === 2) return "第2选择";
        if (rank === 3) return "第3选择";
        return "候选点";
      }

      function currentCandidateContextKey() {
        return reviewFocus ? "review:" + reviewFocus.id : "current";
      }

      function getSelectedCandidate(data) {
        var candidates = getActiveCandidates(data);
        var index = Math.max(0, selectedCandidateRank - 1);

        if (!candidates.length) return null;
        if (index >= candidates.length) index = 0;

        return {
          rank: index + 1,
          candidate: candidates[index]
        };
      }

      function resetSelectedCandidate(data) {
        selectedCandidateRank = getActiveCandidates(data).length ? 1 : 0;
      }

      function ensureSelectedCandidate(data) {
        var candidates = getActiveCandidates(data);

        if (!candidates.length) {
          selectedCandidateRank = 0;
          return;
        }

        if (selectedCandidateRank < 1 || selectedCandidateRank > candidates.length) {
          selectedCandidateRank = 1;
        }
      }

      function playerLabel(color) {
        if (color === "B") return "黑棋";
        if (color === "W") return "白棋";
        return color || "未知";
      }

      function moveRefLabel(color, moveNumber) {
        var shortColor = color === "B" ? "黑" : (color === "W" ? "白" : "");
        if (!shortColor) return "第" + String(moveNumber) + "手";
        return shortColor + "第" + String(moveNumber) + "手";
      }

      function inferPhase(gameSummary) {
        var moveCount = gameSummary && gameSummary.moves_analyzed;

        if (typeof moveCount !== "number") {
          return {
            label: "暂无判断",
            note: "缺少手数信息，暂时无法判断当前阶段。"
          };
        }

        if (moveCount < 40) {
          return {
            label: "布局",
            note: "按当前手数粗略看，仍在布局阶段，重点通常是角边拆挂与全局方向。"
          };
        }

        if (moveCount < 180) {
          return {
            label: "中盘",
            note: "按当前手数粗略看，已进入中盘阶段，重点通常是攻防转换与厚薄处理。"
          };
        }

        return {
          label: "官子",
          note: "按当前手数粗略看，已进入官子阶段，重点通常是收束效率与目数判断。"
        };
      }

      function renderList(items, emptyText, formatter) {
        if (!items || !items.length) {
          return "<div>" + escapeHtml(emptyText) + "</div>";
        }

        return "<ul>" + items.map(function (item, index) {
          return "<li>" + formatter(item, index) + "</li>";
        }).join("") + "</ul>";
      }

      function renderRawJson(data) {
        output.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      }

      function setAnalyzeLoadingState(isLoading) {
        analyzeBtn.disabled = isLoading;
        analyzeBtn.textContent = isLoading ? "分析中…" : defaultAnalyzeButtonText;
      }

      function setUploadLoadingState(isLoading) {
        uploadAnalyzeBtn.disabled = isLoading;
        uploadAnalyzeBtn.textContent = isLoading ? "上传分析中…" : "上传并分析";
      }

      function renderLoadingState() {
        summary.innerHTML = [
          "<div class=\"loading-state\">",
          "<div class=\"loading-spinner\" aria-hidden=\"true\"></div>",
          "<div class=\"loading-text\">正在分析当前局面，请稍候</div>",
          "</div>"
        ].join("");
      }

      function renderErrorState(message) {
        summary.innerHTML = "<div class=\"error-message\">" + escapeHtml(message) + "</div>";
      }

      function clearAnalysisState() {
        analysisData = null;
        reviewFocus = null;
        reviewTargets = [];
        candidateMarkers = [];
        selectedCandidateRank = 1;
        chartMetric = "winrate";
        summary.textContent = "暂无分析结果。";
        output.textContent = "暂无分析数据。";
        setUploadStatus("也可以直接上传 SGF 文件进行分析。", false);
        updateReviewStatus();
      }

      function resetBoardState() {
        moves = [];
        stonesByPoint = {};
        currentColor = "B";
      }

      function appendPassMove(color) {
        moves.push({
          color: color,
          sgf: null,
          captures: [],
          isCaptured: false,
          isPass: true
        });
        currentColor = oppositeColor(color);
      }

      function rebuildBoardFromTimeline(timeline) {
        resetBoardState();

        if (!Array.isArray(timeline)) {
          return;
        }

        for (var i = 0; i < timeline.length; i++) {
          var item = timeline[i];
          var point = extractCoordPoint(item && item.played_move);
          var color = item && item.color ? item.color : currentColor;

          if (!point) {
            appendPassMove(color);
            continue;
          }

          if (!tryPlaceMove(point, color)) {
            throw new Error("无法根据返回的 SGF 分析结果重建第" + String(i + 1) + "手棋盘。");
          }

          currentColor = oppositeColor(color);
        }
      }

      function applyAnalysisResult(data) {
        analysisData = data;
        reviewTargets = buildReviewTargets(data);
        reviewFocus = null;
        resetSelectedCandidate(data);
        candidateMarkers = getCurrentCandidateMarkers(data);
        chartMetric = "winrate";
        drawBoard();
        updateStatus();
        updateReviewStatus();
        renderAnalysisSummary(data);
        renderRawJson(data);
      }

      function syncAnalysisViewButtons() {
        Array.prototype.forEach.call(analysisViewSwitch.querySelectorAll("[data-analysis-view]"), function (button) {
          var isActive = button.getAttribute("data-analysis-view") === analysisView;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      function setAnalysisView(view) {
        analysisView = view === "review" ? "review" : "current";
        syncAnalysisViewButtons();

        if (analysisData) {
          renderAnalysisSummary(analysisData);
        }
      }

      function findTimelineItem(data, moveNumber) {
        var timeline = data && Array.isArray(data.timeline) ? data.timeline : [];

        for (var i = 0; i < timeline.length; i++) {
          if (timeline[i] && timeline[i].move_number === moveNumber) {
            return timeline[i];
          }
        }

        return null;
      }

      function findReviewMistake(data, moveNumber) {
        var selected = data && data.review && Array.isArray(data.review.mistakes_above_threshold)
          ? data.review.mistakes_above_threshold
          : [];

        for (var i = 0; i < selected.length; i++) {
          if (selected[i] && selected[i].move_number === moveNumber) {
            return selected[i];
          }
        }

        return null;
      }

      function buildReviewTarget(data, config) {
        var detail = findReviewMistake(data, config.moveNumber) || findTimelineItem(data, config.moveNumber) || {};
        var topCandidates = Array.isArray(detail.top_candidates) ? detail.top_candidates : [];

        return {
          id: config.id,
          kind: config.kind,
          title: config.title,
          summary: config.summary,
          moveNumber: config.moveNumber,
          color: config.color || detail.color || null,
          label: config.label,
          playedMove: detail.played_move || config.playedMove || null,
          recommendedMove: detail.recommended_move || detail.best_move || config.recommendedMove || null,
          topCandidates: topCandidates,
          pvSummary: detail.pv_summary || ""
        };
      }

      function buildTimelineReviewSummary(detail) {
        var parts = [];
        var scoreDelta;
        var winrateDelta;

        if (!detail || typeof detail.move_number !== "number") {
          return "暂无该手说明。";
        }

        parts.push(moveRefLabel(detail.color, detail.move_number) + "下在" + formatCoord(detail.played_move) + "。");

        if (detail.best_move) {
          parts.push("引擎更推荐" + formatCoord(detail.best_move) + "。");
        }

        if (detail.teaching_label) {
          parts.push("这一手可算" + detail.teaching_label + "。");
        } else if (detail.severity_label) {
          parts.push("这一手评级为" + detail.severity_label + "。");
        } else if (detail.category_label) {
          parts.push("这一手属于" + detail.category_label + "。");
        }

        if (typeof detail.score_before === "number" && typeof detail.score_after === "number") {
          scoreDelta = Math.round((detail.score_after - detail.score_before) * 10) / 10;
          if (scoreDelta >= 0.1) {
            parts.push("局势比推荐下法更好，目数上收益约" + String(scoreDelta) + "目。");
          } else if (scoreDelta <= -0.1) {
            parts.push("目数上亏损约" + String(Math.abs(scoreDelta)) + "目。");
          } else {
            parts.push("目数变化不大。");
          }
        }

        if (typeof detail.winrate_before === "number" && typeof detail.winrate_after === "number") {
          winrateDelta = Math.round((detail.winrate_after - detail.winrate_before) * 100);
          if (winrateDelta >= 1) {
            parts.push("胜率提升约" + String(winrateDelta) + "%。");
          } else if (winrateDelta <= -1) {
            parts.push("胜率下滑约" + String(Math.abs(winrateDelta)) + "%。");
          } else {
            parts.push("胜率变化不大。");
          }
        }

        return parts.join("");
      }

      function buildTimelineReviewTarget(data, moveNumber) {
        var detail = findTimelineItem(data, moveNumber);

        if (!detail || typeof detail.move_number !== "number") {
          return null;
        }

        return {
          id: "timeline-" + detail.move_number,
          kind: "timeline_point",
          title: "走势定位",
          summary: buildTimelineReviewSummary(detail),
          moveNumber: detail.move_number,
          color: detail.color || null,
          label: detail.teaching_label || detail.severity_label || detail.category_label || "走势定位",
          playedMove: detail.played_move || null,
          recommendedMove: detail.best_move || null,
          topCandidates: Array.isArray(detail.top_candidates) ? detail.top_candidates : [],
          pvSummary: detail.pv_summary || ""
        };
      }

      function buildPositiveReviewTargets(data) {
        var timeline = data && Array.isArray(data.timeline) ? data.timeline : [];
        var priority = { "胜负手": 3, "关键好手": 2, "好手": 1 };

        return timeline
          .filter(function (item) {
            return item && priority[item.teaching_label];
          })
          .sort(function (left, right) {
            var leftPriority = priority[left.teaching_label] || 0;
            var rightPriority = priority[right.teaching_label] || 0;
            var leftScore = (typeof left.score_after === "number" && typeof left.score_before === "number")
              ? (left.score_after - left.score_before)
              : 0;
            var rightScore = (typeof right.score_after === "number" && typeof right.score_before === "number")
              ? (right.score_after - right.score_before)
              : 0;

            if (leftPriority !== rightPriority) return rightPriority - leftPriority;
            if (leftScore !== rightScore) return rightScore - leftScore;
            return left.move_number - right.move_number;
          })
          .slice(0, 3)
          .map(function (item) {
            return buildReviewTarget(data, {
              id: "highlight-" + item.move_number,
              kind: "highlight_move",
              title: item.teaching_label,
              summary: buildTimelineReviewSummary(item),
              moveNumber: item.move_number,
              color: item.color,
              label: item.teaching_label,
              playedMove: item.played_move,
              recommendedMove: item.best_move
            });
          });
      }

      function buildReviewTargets(data) {
        var keyPoints = data && data.key_points ? data.key_points : {};
        var turningPoints = Array.isArray(keyPoints.turning_points) ? keyPoints.turning_points : [];
        var planBreaks = Array.isArray(keyPoints.plan_breaks) ? keyPoints.plan_breaks : [];
        var leaveMainBattlefields = Array.isArray(keyPoints.leave_main_battlefields)
          ? keyPoints.leave_main_battlefields
          : [];
        var thresholdMistakes = data && data.review && Array.isArray(data.review.mistakes_above_threshold)
          ? data.review.mistakes_above_threshold
          : [];
        var targets = buildPositiveReviewTargets(data);
        var i;

        for (i = 0; i < turningPoints.length; i++) {
          targets.push(buildReviewTarget(data, {
            id: "turning-" + turningPoints[i].move_number,
            kind: "turning_point",
            title: "转折点",
            summary: turningPoints[i].summary || "暂无说明",
            moveNumber: turningPoints[i].move_number,
            color: turningPoints[i].color,
            label: turningPoints[i].severity_label || "关键点"
          }));
        }

        for (i = 0; i < planBreaks.length; i++) {
          targets.push(buildReviewTarget(data, {
            id: "plan-break-" + planBreaks[i].break_move_number,
            kind: "plan_break",
            title: "没有接上前面的思路",
            summary: planBreaks[i].summary || "暂无说明",
            moveNumber: planBreaks[i].break_move_number,
            color: planBreaks[i].color,
            label: "原计划 " + formatCoord(planBreaks[i].expected_follow_up),
            playedMove: planBreaks[i].played_move,
            recommendedMove: planBreaks[i].expected_follow_up
          }));
        }

        for (i = 0; i < leaveMainBattlefields.length; i++) {
          targets.push(buildReviewTarget(data, {
            id: "leave-main-battlefield-" + leaveMainBattlefields[i].break_move_number,
            kind: "leave_main_battlefield",
            title: "脱离主战场",
            summary: leaveMainBattlefields[i].summary || "暂无说明",
            moveNumber: leaveMainBattlefields[i].break_move_number,
            color: leaveMainBattlefields[i].color,
            label: "主战场应对 " + formatCoord(leaveMainBattlefields[i].expected_follow_up),
            playedMove: leaveMainBattlefields[i].played_move,
            recommendedMove: leaveMainBattlefields[i].expected_follow_up
          }));
        }

        for (i = 0; i < thresholdMistakes.length; i++) {
          if (thresholdMistakes[i].severity !== "major_mistake" && thresholdMistakes[i].severity !== "blunder") {
            continue;
          }

          targets.push(buildReviewTarget(data, {
            id: "major-" + thresholdMistakes[i].move_number,
            kind: "major_mistake",
            title: thresholdMistakes[i].severity === "blunder" ? "大恶手" : "大问题手",
            summary: moveRefLabel(thresholdMistakes[i].color, thresholdMistakes[i].move_number) + "，" +
              (thresholdMistakes[i].category_label || "关键问题") +
              "，损失约" + String(thresholdMistakes[i].score_loss) + "目。",
            moveNumber: thresholdMistakes[i].move_number,
            color: thresholdMistakes[i].color,
            label: thresholdMistakes[i].severity_label || "重点复盘"
          }));
        }

        return targets;
      }

      function renderReviewTargetList(items, emptyText) {
        if (!items.length) {
          return "<div>" + escapeHtml(emptyText) + "</div>";
        }

        return "<ul>" + items.map(function (item) {
          var isActive = reviewFocus && reviewFocus.id === item.id;

          return [
            "<li>",
            "<button type=\"button\" class=\"review-item-button" + (isActive ? " active" : "") + "\" data-review-id=\"" + escapeHtml(item.id) + "\">",
            "<strong>" + escapeHtml(item.title) + " · " + escapeHtml(moveRefLabel(item.color, item.moveNumber)) + "</strong>",
            "<span>" + escapeHtml(item.summary) + "</span>",
            "<span class=\"review-item-meta\">",
            "实战 " + escapeHtml(formatCoord(item.playedMove)) +
            " | 推荐 " + escapeHtml(formatCoord(item.recommendedMove)) +
            (item.label ? " | " + escapeHtml(item.label) : ""),
            "</span>",
            "</button>",
            "</li>"
          ].join("");
        }).join("") + "</ul>";
      }

      function activateReviewTargetById(targetId) {
        var target = null;

        for (var i = 0; i < reviewTargets.length; i++) {
          if (reviewTargets[i].id === targetId) {
            target = reviewTargets[i];
            break;
          }
        }

        if (!target) return;

        reviewFocus = target;
        resetSelectedCandidate(analysisData);
        candidateMarkers = getCandidateMarkersFromCandidates(target.topCandidates);
        drawBoard();
        updateReviewStatus();
        renderAnalysisSummary(analysisData);
      }

      function activateTimelineMove(moveNumber) {
        var target;

        if (!analysisData) return;

        target = buildTimelineReviewTarget(analysisData, moveNumber);
        if (!target) return;

        reviewFocus = target;
        resetSelectedCandidate(analysisData);
        candidateMarkers = getCandidateMarkersFromCandidates(target.topCandidates);
        drawBoard();
        updateReviewStatus();
        renderAnalysisSummary(analysisData);
      }

      function returnToLatestBoardState() {
        reviewFocus = null;
        resetSelectedCandidate(analysisData);
        candidateMarkers = getCurrentCandidateMarkers(analysisData);
        drawBoard();
        updateReviewStatus();
        renderAnalysisSummary(analysisData);
      }

      function candidateDeltaText(activeCandidates, rank, candidate) {
        var best = activeCandidates && activeCandidates[0];
        var scoreDiff;
        var winrateDiff;
        var parts = [];

        if (rank === 1 || !best) {
          return "这是当前最优推荐点。";
        }

        if (typeof best.score_estimate === "number" && typeof candidate.score_estimate === "number") {
          scoreDiff = Math.round((best.score_estimate - candidate.score_estimate) * 10) / 10;
          parts.push("比第1选择少" + String(scoreDiff) + "目左右");
        }

        if (typeof best.winrate === "number" && typeof candidate.winrate === "number") {
          winrateDiff = Math.round((best.winrate - candidate.winrate) * 100);
          parts.push("胜率低约" + String(winrateDiff) + "%");
        }

        if (!parts.length) {
          return "这是备选变化，可作为局部对比参考。";
        }

        return "这是备选变化，" + parts.join("，") + "。";
      }

      function buildCandidateExplanation(data) {
        var selected = getSelectedCandidate(data);
        var activeCandidates = getActiveCandidates(data);
        var pvSummary = reviewFocus
          ? (reviewFocus.pvSummary || "")
          : ((data && data.current_position && data.current_position.pv_summary) || "");
        var candidate;
        var rankLabel;
        var scoreText;
        var winrateText;
        var pvText;

        if (!selected) {
          return "<div>暂无候选点说明。</div>";
        }

        candidate = selected.candidate;
        rankLabel = candidateRankLabel(selected.rank);
        scoreText = typeof candidate.score_estimate === "number"
          ? String(Math.round(candidate.score_estimate * 10) / 10) + "目"
          : "暂无目差";
        winrateText = typeof candidate.winrate === "number"
          ? String(Math.round(candidate.winrate * 100)) + "%"
          : "暂无胜率";

        if (pvSummary) {
          pvText = selected.rank === 1
            ? pvSummary
            : "当前只拿到主推荐主线：" + pvSummary;
        } else {
          pvText = "暂无完整PV，只展示候选点本身的胜率与目差。";
        }

        return [
          "<div class=\"candidate-detail-panel\" data-candidate-context=\"" + escapeHtml(currentCandidateContextKey()) + "\">",
          "<div class=\"candidate-detail-title\">",
          "<span class=\"candidate-rank-badge\">" + escapeHtml(rankLabel) + "</span>",
          "<strong>" + escapeHtml(formatCoord(candidate.move)) + "</strong>",
          "</div>",
          "<p>这一步的预计胜率约为" + escapeHtml(winrateText) + "，目差约为" + escapeHtml(scoreText) + "。</p>",
          "<p>" + escapeHtml(candidateDeltaText(activeCandidates, selected.rank, candidate)) + "</p>",
          "<p>变化参考：" + escapeHtml(pvText) + "</p>",
          "</div>"
        ].join("");
      }

      function renderCandidateChoiceList(activeCandidates) {
        if (!activeCandidates.length) {
          return "<div>暂无候选点。</div>";
        }

        return [
          "<div class=\"candidate-choice-list\">",
          activeCandidates.map(function (candidate, index) {
            var rank = index + 1;
            var isActive = rank === selectedCandidateRank;

            return [
              "<button type=\"button\" class=\"candidate-choice-button" + (isActive ? " active" : "") + "\" data-candidate-rank=\"" + rank + "\">",
              "<span class=\"candidate-choice-rank\">" + escapeHtml(candidateRankLabel(rank)) + "</span>",
              "<strong>" + escapeHtml(formatCoord(candidate.move)) + "</strong>",
              "<span class=\"candidate-choice-meta\">胜率约" +
                escapeHtml(typeof candidate.winrate === "number" ? String(Math.round(candidate.winrate * 100)) : "0") +
                "%，目差约" +
                escapeHtml(typeof candidate.score_estimate === "number" ? String(Math.round(candidate.score_estimate * 10) / 10) : "暂无") +
                "</span>",
              "</button>"
            ].join("");
          }).join(""),
          "</div>"
        ].join("");
      }

      function hasTrendMetric(timeline, metric) {
        if (!timeline || !timeline.length) return false;

        return timeline.some(function (item) {
          return item && typeof item[metric] === "number";
        });
      }

      function buildTrendSeries(timeline, metric) {
        if (!timeline || !timeline.length) return [];

        return timeline
          .map(function (item) {
            if (!item || typeof item.move_number !== "number" || typeof item[metric] !== "number") {
              return null;
            }

            return {
              moveNumber: item.move_number,
              value: item[metric]
            };
          })
          .filter(Boolean);
      }

      function formatTrendValue(metric, value) {
        if (metric === "winrate") {
          return Math.round(value * 100) + "%";
        }

        var rounded = Math.round(value * 10) / 10;
        return String(rounded);
      }

      function buildTrendContext(timeline) {
        var latest;
        var parts = [];

        if (!timeline || !timeline.length) {
          return "暂无走势背景。";
        }

        latest = timeline[timeline.length - 1];
        if (!latest || typeof latest.move_number !== "number") {
          return "暂无走势背景。";
        }

        parts.push("目前看到第" + latest.move_number + "手。");

        if (typeof latest.winrate_after === "number") {
          parts.push("实战后胜率约 " + formatTrendValue("winrate", latest.winrate_after) + "。");
        }

        if (typeof latest.score_after === "number") {
          parts.push("目差约 " + formatTrendValue("score", latest.score_after) + "。");
        }

        return parts.join("");
      }

      function linePath(points) {
        if (!points.length) return "";

        return points.map(function (point, index) {
          return (index === 0 ? "M" : "L") + point.x + " " + point.y;
        }).join(" ");
      }

      function renderTrendChart(timeline) {
        var container = document.getElementById("trendChartSection");
        if (!container) return;

        var hasWinrate = hasTrendMetric(timeline, "winrate_after");
        var hasScore = hasTrendMetric(timeline, "score_after");
        var activeMetric = chartMetric;
        var series;
        var minValue;
        var maxValue;
        var width;
        var height;
        var padding;
        var points;
        var path;
        var axisLabels;
        var firstPoint;
        var lastPoint;
        var selectedMoveNumber = reviewFocus ? reviewFocus.moveNumber : (timeline.length ? timeline[timeline.length - 1].move_number : null);

        if (!hasWinrate && !hasScore) {
          container.innerHTML = "<div>暂无可绘制的走势数据。</div>";
          return;
        }

        if (activeMetric === "winrate" && !hasWinrate) activeMetric = "score";
        if (activeMetric === "score" && !hasScore) activeMetric = "winrate";
        chartMetric = activeMetric;

        series = buildTrendSeries(timeline, activeMetric === "winrate" ? "winrate_after" : "score_after");
        if (!series.length) {
          container.innerHTML = "<div>暂无可绘制的走势数据。</div>";
          return;
        }

        minValue = series[0].value;
        maxValue = series[0].value;
        for (var i = 1; i < series.length; i++) {
          minValue = Math.min(minValue, series[i].value);
          maxValue = Math.max(maxValue, series[i].value);
        }

        if (minValue === maxValue) {
          minValue -= activeMetric === "winrate" ? 0.02 : 1;
          maxValue += activeMetric === "winrate" ? 0.02 : 1;
        }

        width = 300;
        height = 160;
        padding = { top: 12, right: 12, bottom: 28, left: 36 };
        points = series.map(function (item, index) {
          var x;
          var y;
          var xSpan = Math.max(1, series.length - 1);
          var ySpan = maxValue - minValue;

          x = padding.left + ((width - padding.left - padding.right) * index) / xSpan;
          y = padding.top + ((height - padding.top - padding.bottom) * (maxValue - item.value)) / ySpan;

          return {
            x: Math.round(x * 10) / 10,
            y: Math.round(y * 10) / 10,
            moveNumber: item.moveNumber,
            value: item.value,
            isSelected: item.moveNumber === selectedMoveNumber
          };
        });
        path = linePath(points);
        axisLabels = [
          formatTrendValue(activeMetric, maxValue),
          formatTrendValue(activeMetric, (minValue + maxValue) / 2),
          formatTrendValue(activeMetric, minValue)
        ];
        firstPoint = points[0];
        lastPoint = points[points.length - 1];

        container.innerHTML = [
          "<div class=\"chart-controls\">",
          hasWinrate ? "<button type=\"button\" data-chart-metric=\"winrate\" class=\"" + (activeMetric === "winrate" ? "active" : "") + "\">胜率</button>" : "",
          hasScore ? "<button type=\"button\" data-chart-metric=\"score\" class=\"" + (activeMetric === "score" ? "active" : "") + "\">目差</button>" : "",
          "</div>",
          "<div class=\"trend-chart\">",
          "<svg viewBox=\"0 0 " + width + " " + height + "\" role=\"img\" aria-label=\"走势折线图\">",
          "<line x1=\"" + padding.left + "\" y1=\"" + padding.top + "\" x2=\"" + padding.left + "\" y2=\"" + (height - padding.bottom) + "\" stroke=\"#999\" stroke-width=\"1\" />",
          "<line x1=\"" + padding.left + "\" y1=\"" + (height - padding.bottom) + "\" x2=\"" + (width - padding.right) + "\" y2=\"" + (height - padding.bottom) + "\" stroke=\"#999\" stroke-width=\"1\" />",
          "<line x1=\"" + padding.left + "\" y1=\"" + (padding.top + (height - padding.top - padding.bottom) / 2) + "\" x2=\"" + (width - padding.right) + "\" y2=\"" + (padding.top + (height - padding.top - padding.bottom) / 2) + "\" stroke=\"#ddd\" stroke-width=\"1\" />",
          "<path d=\"" + path + "\" fill=\"none\" stroke=\"#2f6db3\" stroke-width=\"2\" />",
          points.map(function (point) {
            return [
              "<circle",
              " cx=\"" + point.x + "\"",
              " cy=\"" + point.y + "\"",
              " r=\"" + (point.isSelected ? "7" : "5") + "\"",
              " fill=\"" + (point.isSelected ? "#c74b16" : "#ffffff") + "\"",
              " stroke=\"" + (point.isSelected ? "#c74b16" : "#2f6db3") + "\"",
              " stroke-width=\"" + (point.isSelected ? "3" : "2") + "\"",
              " data-chart-move=\"" + point.moveNumber + "\"",

      function createBoardSnapshot(uptoMoveCount) {
        var snapshot = {
          stonesByPoint: {},
          moves: []
        };

        function snapshotStoneAt(x, y) {
          return snapshot.stonesByPoint[pointKey(x, y)] || null;
        }

        function collectSnapshotGroup(startX, startY) {
          var startStone = snapshotStoneAt(startX, startY);
          var stack;
          var seen;
          var group;
          var liberties;

          if (!startStone) return null;

          stack = [{ x: startX, y: startY }];
          seen = {};
          group = [];
          liberties = {};

          while (stack.length) {
            var point = stack.pop();
            var key = pointKey(point.x, point.y);
            var stone;
            var neighbors;
            var i;

            if (seen[key]) continue;
            seen[key] = true;

            stone = snapshotStoneAt(point.x, point.y);
            if (!stone || stone.color !== startStone.color) continue;

            group.push(stone);
            neighbors = neighborsOf(point.x, point.y);
            for (i = 0; i < neighbors.length; i++) {
              var neighbor = neighbors[i];
              var neighborStone = snapshotStoneAt(neighbor.x, neighbor.y);

              if (!neighborStone) {
                liberties[pointKey(neighbor.x, neighbor.y)] = true;
                continue;
              }

              if (neighborStone.color === startStone.color && !seen[pointKey(neighbor.x, neighbor.y)]) {
                stack.push(neighbor);
              }
            }
          }

          return {
            stones: group,
            libertyCount: Object.keys(liberties).length
          };
        }

        function applySnapshotMove(sourceMove) {
          var point = extractCoordPoint(sourceMove && (sourceMove.sgf || sourceMove.played_move));
          var move;
          var neighbors;
          var capturedStones;
          var seenGroups;
          var i;

          if (!point) {
            snapshot.moves.push({
              color: sourceMove.color,
              sgf: null,
              captures: [],
              isCaptured: false,
              isPass: true
            });
            return;
          }

          move = {
            x: point.x,
            y: point.y,
            color: sourceMove.color,
            sgf: toSgf(point.x, point.y),
            captures: [],
            isCaptured: false,
            isPass: false
          };
          snapshot.stonesByPoint[pointKey(point.x, point.y)] = move;

          neighbors = neighborsOf(point.x, point.y);
          capturedStones = [];
          seenGroups = {};

          for (i = 0; i < neighbors.length; i++) {
            var neighbor = neighbors[i];
            var neighborStone = snapshotStoneAt(neighbor.x, neighbor.y);
            var groupInfo;
            var groupKey;
            var j;

            if (!neighborStone || neighborStone.color !== oppositeColor(sourceMove.color)) continue;

            groupKey = pointKey(neighbor.x, neighbor.y);
            if (seenGroups[groupKey]) continue;

            groupInfo = collectSnapshotGroup(neighbor.x, neighbor.y);
            if (!groupInfo) continue;

            for (j = 0; j < groupInfo.stones.length; j++) {
              seenGroups[pointKey(groupInfo.stones[j].x, groupInfo.stones[j].y)] = true;
            }

            if (groupInfo.libertyCount === 0) {
              for (j = 0; j < groupInfo.stones.length; j++) {
                capturedStones.push(groupInfo.stones[j]);
              }
            }
          }

          for (i = 0; i < capturedStones.length; i++) {
            delete snapshot.stonesByPoint[pointKey(capturedStones[i].x, capturedStones[i].y)];
            capturedStones[i].isCaptured = true;
          }

          move.captures = capturedStones;
          snapshot.moves.push(move);
        }

        for (var i = 0; i < Math.min(uptoMoveCount, moves.length); i++) {
          applySnapshotMove(moves[i]);
        }

        return snapshot;
      }

      function syncCanvasSize() {
        var rect = boardElement.getBoundingClientRect();
        var size = Math.min(640, Math.floor(rect.width || boardElement.clientWidth || 640));
        var ratio = window.devicePixelRatio || 1;
        canvas.width = size * ratio;
        canvas.height = size * ratio;
        canvas.style.width = size + "px";
        canvas.style.height = size + "px";
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        boardMetrics = {
          size: size,
          padding: size * 0.075,
          cell: (size - size * 0.15) / (BOARD_SIZE - 1)
        };
        drawBoard();
      }

      function boardPoint(index) {
        return boardMetrics.padding + index * boardMetrics.cell;
      }

      function drawGrid() {
        context.strokeStyle = "#5d3c1a";
        context.lineWidth = 1;

        for (var i = 0; i < BOARD_SIZE; i++) {
          var pos = boardPoint(i);
          var start = boardPoint(0);
          var end = boardPoint(BOARD_SIZE - 1);

          context.beginPath();
          context.moveTo(start, pos);
          context.lineTo(end, pos);
          context.stroke();

          context.beginPath();
          context.moveTo(pos, start);
          context.lineTo(pos, end);
          context.stroke();
        }
      }

      function drawStarPoints() {
        context.fillStyle = "#5d3c1a";

        for (var y = 0; y < STAR_POINTS.length; y++) {
          for (var x = 0; x < STAR_POINTS.length; x++) {
            context.beginPath();
            context.arc(boardPoint(STAR_POINTS[x]), boardPoint(STAR_POINTS[y]), Math.max(3, boardMetrics.cell * 0.1), 0, Math.PI * 2);
            context.fill();
          }
        }
      }

      function drawStone(move, moveNumber, isLatestMove) {
        var x = boardPoint(move.x);
        var y = boardPoint(move.y);
        var radius = boardMetrics.cell * 0.45;
        var gradient = context.createRadialGradient(x - radius * 0.35, y - radius * 0.35, radius * 0.1, x, y, radius);
        var label = String(moveNumber);

        if (move.color === "B") {
          gradient.addColorStop(0, "#666");
          gradient.addColorStop(1, "#111");
        } else {
          gradient.addColorStop(0, "#fff");
          gradient.addColorStop(1, "#d8d8d8");
        }

        context.fillStyle = gradient;
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = move.color === "B" ? "#000" : "#999";
        context.stroke();

        if (isLatestMove) {
          context.save();
          context.strokeStyle = reviewFocus && moveNumber === reviewFocus.moveNumber ? "#c74b16" : (move.color === "B" ? "#f5d36b" : "#b85c00");
          context.lineWidth = Math.max(2, boardMetrics.cell * (reviewFocus && moveNumber === reviewFocus.moveNumber ? 0.11 : 0.08));
          context.beginPath();
          context.arc(x, y, radius * 0.78, 0, Math.PI * 2);
          context.stroke();

          if (reviewFocus && moveNumber === reviewFocus.moveNumber) {
            context.strokeStyle = "rgba(199, 75, 22, 0.28)";
            context.lineWidth = Math.max(4, boardMetrics.cell * 0.14);
            context.beginPath();
            context.arc(x, y, radius * 1.05, 0, Math.PI * 2);
            context.stroke();
          }
          context.restore();
        }

        context.save();
        context.fillStyle = move.color === "B" ? "#f4f4f4" : "#111";
        context.font = "bold " + Math.max(10, Math.floor(radius * (label.length > 2 ? 0.9 : 1.1))) + "px sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(label, x, y + 0.5);
        context.restore();
      }

      function candidateMarkerStyle(rank, isSelected) {
        if (rank === 1) {
          return {
            outerStroke: "#1f7a3d",
            innerStroke: "rgba(232, 247, 237, 0.98)",
            dotFill: "#1f7a3d",
            ringScale: 0.52,
            lineWidth: isSelected ? 0.11 : 0.085,
            glow: "rgba(31, 122, 61, 0.28)"
          };
        }

        if (rank === 2) {
          return {
            outerStroke: "#43a35f",
            innerStroke: "rgba(239, 250, 242, 0.96)",
            dotFill: "#43a35f",
            ringScale: 0.45,
            lineWidth: isSelected ? 0.095 : 0.07,
            glow: "rgba(67, 163, 95, 0.26)"
          };
        }

        return {
          outerStroke: "#7bc98f",
          innerStroke: "rgba(247, 253, 248, 0.94)",
          dotFill: "#7bc98f",
          ringScale: 0.39,
          lineWidth: isSelected ? 0.085 : 0.06,
          glow: "rgba(123, 201, 143, 0.24)"
        };
      }

      function drawCandidateMarker(point, stoneMap) {
        var x = boardPoint(point.x);
        var y = boardPoint(point.y);
        var stone = stoneMap[pointKey(point.x, point.y)] || null;
        var isSelected = point.rank === selectedCandidateRank;
        var style = candidateMarkerStyle(point.rank, isSelected);
        var ringRadius = boardMetrics.cell * (stone ? Math.max(0.5, style.ringScale) : style.ringScale) + (isSelected ? boardMetrics.cell * 0.04 : 0);
        var dotRadius = boardMetrics.cell * (isSelected ? 0.13 : 0.1);

        context.save();
        if (isSelected) {
          context.shadowColor = style.glow;
          context.shadowBlur = Math.max(8, boardMetrics.cell * 0.35);
        }
        context.strokeStyle = style.outerStroke;
        context.lineWidth = Math.max(2, boardMetrics.cell * style.lineWidth);
        context.beginPath();
        context.arc(x, y, ringRadius, 0, Math.PI * 2);
        context.stroke();

        context.strokeStyle = style.innerStroke;
        context.lineWidth = Math.max(2, boardMetrics.cell * 0.04);
        context.beginPath();
        context.arc(x, y, ringRadius - Math.max(3, boardMetrics.cell * 0.08), 0, Math.PI * 2);
        context.stroke();

        context.fillStyle = style.dotFill;
        context.beginPath();
        context.arc(x, y, dotRadius, 0, Math.PI * 2);
        context.fill();

        context.shadowBlur = 0;
        context.fillStyle = isSelected ? "#fff" : "#1d3d25";
        context.font = "bold " + Math.max(10, Math.floor(boardMetrics.cell * 0.23)) + "px sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(String(point.rank), x, y + 0.5);
        context.restore();
      }

      function trySelectCandidateAtPoint(point) {
        for (var i = 0; i < candidateMarkers.length; i++) {
          if (candidateMarkers[i].x === point.x && candidateMarkers[i].y === point.y) {
            selectedCandidateRank = candidateMarkers[i].rank;
            drawBoard();
            renderAnalysisSummary(analysisData);
            return true;
          }
        }

        return false;
      }

      function drawRecommendedMoveMarker(move) {
        var point = extractCoordPoint(move);
        var x;
        var y;
        var size;

        if (!point) return;

        x = boardPoint(point.x);
        y = boardPoint(point.y);
        size = boardMetrics.cell * 0.26;

        context.save();
        context.strokeStyle = "#c74b16";
        context.lineWidth = Math.max(2, boardMetrics.cell * 0.06);
        context.beginPath();
        context.rect(x - size, y - size, size * 2, size * 2);
        context.stroke();
        context.beginPath();
        context.moveTo(x - size * 0.7, y);
        context.lineTo(x + size * 0.7, y);
        context.moveTo(x, y - size * 0.7);
        context.lineTo(x, y + size * 0.7);
        context.stroke();
        context.restore();
      }

      function drawBoard() {
        var activeMoves = [];
        var renderedMoveCount = reviewFocus ? reviewFocus.moveNumber : moves.length;
        var snapshot = createBoardSnapshot(renderedMoveCount);
        var recommendedMove = reviewFocus ? reviewFocus.recommendedMove : (analysisData && analysisData.current_position ? analysisData.current_position.best_move : null);
        var i;

        if (!boardMetrics) return;

        context.clearRect(0, 0, boardMetrics.size, boardMetrics.size);
        context.fillStyle = "#ddb56d";
        context.fillRect(0, 0, boardMetrics.size, boardMetrics.size);
        drawGrid();
        drawStarPoints();

        for (i = 0; i < snapshot.moves.length; i++) {
          if (!snapshot.moves[i].isCaptured && !snapshot.moves[i].isPass) {
            activeMoves.push({
              move: snapshot.moves[i],
              moveNumber: i + 1
            });
          }
        }

        for (i = 0; i < activeMoves.length; i++) {
          drawStone(activeMoves[i].move, activeMoves[i].moveNumber, activeMoves[i].moveNumber === renderedMoveCount);
        }

        for (i = 0; i < candidateMarkers.length; i++) {
          drawCandidateMarker(candidateMarkers[i], snapshot.stonesByPoint);
        }

        drawRecommendedMoveMarker(recommendedMove);
      }

      function clickToPoint(event) {
        var rect = canvas.getBoundingClientRect();
        var x = event.clientX - rect.left;
        var y = event.clientY - rect.top;
        var gridX = Math.round((x - boardMetrics.padding) / boardMetrics.cell);
        var gridY = Math.round((y - boardMetrics.padding) / boardMetrics.cell);

        if (gridX < 0 || gridY < 0 || gridX >= BOARD_SIZE || gridY >= BOARD_SIZE) return null;

        var snappedX = boardPoint(gridX);
        var snappedY = boardPoint(gridY);
        var tolerance = boardMetrics.cell * 0.45;

        if (Math.abs(x - snappedX) > tolerance || Math.abs(y - snappedY) > tolerance) return null;

        return { x: gridX, y: gridY };
      }

      canvas.addEventListener("click", function (event) {
        var point = clickToPoint(event);
        if (!point) return;
        if (analysisData && trySelectCandidateAtPoint(point)) return;
        if (reviewFocus) return;
        if (!tryPlaceMove(point, currentColor)) return;

        clearAnalysisState();
        currentColor = oppositeColor(currentColor);
        drawBoard();
        updateStatus();
      });

      undoBtn.addEventListener("click", function () {
        if (!moves.length) return;
        undoLastMove();
        clearAnalysisState();
        currentColor = moves.length % 2 === 0 ? "B" : "W";
        drawBoard();
        updateStatus();
      });

      clearBtn.addEventListener("click", function () {
        resetBoardState();
        clearAnalysisState();
        drawBoard();
        updateStatus();
      });

      latestBtn.addEventListener("click", function () {
        if (!analysisData) return;
        returnToLatestBoardState();
      });

      Array.prototype.forEach.call(analysisViewSwitch.querySelectorAll("[data-analysis-view]"), function (button) {
        button.addEventListener("click", function () {
          setAnalysisView(this.getAttribute("data-analysis-view"));
        });
      });

      analyzeBtn.addEventListener("click", async function () {
        setAnalyzeLoadingState(true);

        try {
          candidateMarkers = [];
          drawBoard();
          renderLoadingState();
          output.textContent = "分析中...";
          chartMetric = "winrate";

          var payload = {
            board_size: BOARD_SIZE,
            komi: 6.5,
            moves: moves.map(function (m) {
              return {
                color: m.color,
                sgf: m.sgf
              };
            })
          };

          var response = await fetch("http://127.0.0.1:8000/api/v1/analyze-moves", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          var data;
          try {
            data = await response.json();
          } catch (parseErr) {
            data = { error: "Non-JSON response", status: response.status };
          }

          if (!response.ok) {
            data = {
              request: payload,
              error: data,
              status: response.status
            };
            renderErrorState("分析失败，请展开原始数据查看详情。");
            renderRawJson(data);
            return;
          }

          applyAnalysisResult(data);
        } catch (err) {
          clearAnalysisState();
          drawBoard();
          renderErrorState("分析失败，请检查后端服务是否启动，并展开原始数据查看详情。");
          renderRawJson({ error: String(err) });
        } finally {
          setAnalyzeLoadingState(false);
        }
      });

      uploadAnalyzeBtn.addEventListener("click", async function () {
        var file = sgfFileInput.files && sgfFileInput.files[0];

        if (!file) {
          setUploadStatus("请选择一个 SGF 文件后再上传。", true);
          return;
        }

        setUploadLoadingState(true);

        try {
          candidateMarkers = [];
          drawBoard();
          renderLoadingState();
          output.textContent = "分析中...";
          setUploadStatus("正在上传并分析 SGF 文件，请稍候。", false);

          var formData = new FormData();
          formData.append("file", file);

          var response = await fetch("http://127.0.0.1:8000/api/v1/analyze-sgf", {
            method: "POST",
            body: formData
          });

          var data;
          try {
            data = await response.json();
          } catch (parseErr) {
            data = { error: "Non-JSON response", status: response.status };
          }

          if (!response.ok) {
            renderErrorState("上传分析失败，请检查 SGF 文件格式或后端服务。");
            renderRawJson({
              file_name: file.name,
              error: data,
              status: response.status
            });
            setUploadStatus(
              "上传分析失败：" + (data && data.detail ? String(data.detail) : "请检查 SGF 文件格式或后端服务。"),
              true
            );
            return;
          }

          rebuildBoardFromTimeline(data.timeline);
          applyAnalysisResult(data);
          setUploadStatus("已完成 SGF 分析，并载入终局棋盘。", false);
        } catch (err) {
          clearAnalysisState();
          resetBoardState();
          drawBoard();
          updateStatus();
          renderErrorState("上传分析失败，请检查后端服务是否启动，并展开原始数据查看详情。");
          renderRawJson({ error: String(err) });
          setUploadStatus("上传分析失败：" + String(err), true);
        } finally {
          setUploadLoadingState(false);
        }
      });

      window.addEventListener("resize", syncCanvasSize);

      syncCanvasSize();
      updateStatus();
      updateReviewStatus();
      syncAnalysisViewButtons();
      setUploadStatus("也可以直接上传 SGF 文件进行分析。", false);
    })();
  </script>
</body>
</html>
