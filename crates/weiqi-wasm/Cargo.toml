[package]
name = "weiqi-wasm"
version = "0.0.0"
description = "WebAssembly bindings for weiqi-core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]
# Its rustdoc is not useful on its own; the JS API is documented by the
# generated TypeScript declarations.
doc = false

[dependencies]
js-sys = "0.3.107"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
# The CLI that generates the JS glue must be the same version (0.2.130).
wasm-bindgen = "=0.2.130"
weiqi = { package = "weiqi-core", path = "../weiqi-core" }
