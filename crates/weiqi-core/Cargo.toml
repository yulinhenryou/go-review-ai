[package]
name = "weiqi-core"
version = "0.0.0"
description = "Go rules, SGF parsing, position hashing and scoring."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
encoding_rs = "0.8.44"
thiserror = "2.0.21"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"

[[bench]]
name = "replay"
harness = false

[[bench]]
name = "sgf"
harness = false
