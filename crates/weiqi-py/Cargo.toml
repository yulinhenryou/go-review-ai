[package]
name = "weiqi-py"
version = "0.0.0"
description = "Python bindings for weiqi-core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The Python module name: `import weiqi_core`.
name = "weiqi_core"
crate-type = ["cdylib"]
# Its rustdoc would share `weiqi_core`'s output path; the Python API is
# documented by `weiqi_core.pyi` instead.
doc = false

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py314"] }
# Renamed because this library itself is called `weiqi_core`.
weiqi = { package = "weiqi-core", path = "../weiqi-core" }
