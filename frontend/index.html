<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>围棋复盘 · 本地工作台</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-stones" aria-hidden="true"></span><h1>围棋复盘</h1></div>
    <span class="workspace-label">本地工作台 <span class="version">M3</span></span>
  </header>

  <section class="input-bar" aria-label="棋谱输入">
    <div class="upload-controls">
      <input id="sgfFileInput" type="file" accept=".sgf,application/x-go-sgf,text/plain" aria-label="选择 SGF 文件" />
      <button id="uploadAnalyzeBtn" type="button"><img src="./icons/upload.svg" alt="" /><span>上传并分析</span></button>
    </div>
    <div class="game-settings">
      <label for="rulesInput">规则
        <select id="rulesInput">
          <option value="custom">自定义</option>
          <option value="chinese">中国规则</option>
          <option value="japanese">日韩规则</option>
        </select>
      </label>
      <label for="komiInput">贴目
        <input id="komiInput" type="number" min="-150" max="150" step="0.5" inputmode="decimal" />
      </label>
      <label id="customRulesLabel" for="customRulesInput">计分方式
        <select id="customRulesInput">
          <option value="chinese">中国数子</option>
          <option value="japanese">日韩数目</option>
        </select>
      </label>
    </div>
  </section>
  <div class="meta upload-status" id="uploadStatus" role="status"></div>

  <main class="layout">
    <section class="board-column" aria-label="棋盘工作区">
      <div class="board-toolbar">
        <span class="meta" id="status">下一手：黑棋 | 手数：0</span>
        <div class="display-options">
          <label><input id="showCandidates" type="checkbox" checked />候选点</label>
          <label><input id="showMoveNumbers" type="checkbox" />手数</label>
        </div>
      </div>
      <div class="board-meta">
        <div class="review-meta" id="reviewStatus" aria-live="polite"></div>
        <div class="board-legend" aria-label="棋盘标记图例">
          <span><i class="legend-actual" aria-hidden="true"></i>实战</span>
          <span><i class="legend-played" aria-hidden="true">!</i>失误</span>
          <span><i class="legend-best" aria-hidden="true"></i>推荐</span>
          <span><i class="legend-candidate" aria-hidden="true">2</i>候选</span>
        </div>
      </div>
      <div id="board">
        <canvas id="boardCanvas" aria-label="围棋棋盘"></canvas>
      </div>
      <div id="boardPointSummary" class="point-summary" aria-live="polite"></div>
      <div class="board-footer">
        <div class="controls">
          <button id="undoBtn" type="button" class="icon-button" aria-label="悔棋" title="悔棋"><img src="./icons/undo-2.svg" alt="" /></button>
          <button id="clearBtn" type="button" class="icon-button" aria-label="清空棋盘" title="清空棋盘"><img src="./icons/trash-2.svg" alt="" /></button>
          <button id="editBtn" type="button" class="icon-button" aria-label="继续录入" title="继续录入" hidden><img src="./icons/pencil.svg" alt="" /></button>
          <button id="analyzeBtn" type="button" class="primary"><img src="./icons/scan-line.svg" alt="" /><span>开始分析</span></button>
        </div>
        <div class="review-nav" aria-label="复盘导航">
          <button id="prevReviewBtn" type="button" class="icon-button" aria-label="上一步" title="上一步" disabled><img src="./icons/chevron-left.svg" alt="" /></button>
          <span id="moveCounter" class="move-counter">0 / 0</span>
          <button id="nextReviewBtn" type="button" class="icon-button" aria-label="下一步" title="下一步" disabled><img src="./icons/chevron-right.svg" alt="" /></button>
          <button id="latestBtn" type="button" class="icon-button" aria-label="回到最新局面" title="回到最新局面" disabled><img src="./icons/skip-forward.svg" alt="" /></button>
        </div>
      </div>
    </section>

    <aside class="panel" aria-label="复盘报告">
      <div class="panel-heading"><h2>复盘报告</h2><span class="engine-label">KataGo</span></div>
      <div class="view-switch" id="analysisViewSwitch" aria-label="分析视图切换">
        <button id="currentViewBtn" type="button" class="active" data-analysis-view="current">当前局面</button>
        <button id="reviewViewBtn" type="button" data-analysis-view="review">整盘复盘</button>
      </div>
      <div id="analysisSummary"><div class="empty-state">暂无分析结果</div></div>
      <details class="raw-data">
        <summary>原始分析数据</summary>
        <pre id="analysisOutput">暂无分析数据。</pre>
      </details>
    </aside>
  </main>

  <script type="module">
    import { createGameSettings } from "./game-settings.mjs";
    import { renderReportOverview, renderMistakeMarkers, renderQualityNotes, trendPath } from "./report-view.mjs";
    import { buildBoardMarkers, markerDescription } from "./board-markers.mjs";

    (function () {
      var boardElement = document.getElementById("board");
      var canvas = document.getElementById("boardCanvas");
      var context = canvas.getContext("2d");
      var showCandidates = document.getElementById("showCandidates");
      var showMoveNumbers = document.getElementById("showMoveNumbers");
      var pointSummary = document.getElementById("boardPointSummary");
      var editBtn = document.getElementById("editBtn");
      var visibleMarkers = [];
      var isBusy = false;
      var summary = document.getElementById("analysisSummary");
      var output = document.getElementById("analysisOutput");
      var status = document.getElementById("status");
      var reviewStatus = document.getElementById("reviewStatus");
      var undoBtn = document.getElementById("undoBtn");
      var clearBtn = document.getElementById("clearBtn");
      var analyzeBtn = document.getElementById("analyzeBtn");
      var rulesInput = document.getElementById("rulesInput");
      var komiInput = document.getElementById("komiInput");
      var gameSettings = createGameSettings({
        rulesInput: rulesInput,
        komiInput: komiInput,
        customRulesInput: document.getElementById("customRulesInput"),
        customRulesLabel: document.getElementById("customRulesLabel")
      });
      var latestBtn = document.getElementById("latestBtn");
      var prevReviewBtn = document.getElementById("prevReviewBtn");
      var nextReviewBtn = document.getElementById("nextReviewBtn");
      var sgfFileInput = document.getElementById("sgfFileInput");
      var uploadAnalyzeBtn = document.getElementById("uploadAnalyzeBtn");
      var uploadStatus = document.getElementById("uploadStatus");
      var analysisViewSwitch = document.getElementById("analysisViewSwitch");
      var BOARD_SIZE = 19;
      var SGF_LETTERS = "abcdefghijklmnopqrstuvwxyz";
      var DISPLAY_COLUMNS = "ABCDEFGHJKLMNOPQRST";
      var STAR_POINTS = [3, 9, 15];
      var moves = [];
      var stonesByPoint = {};
      var currentColor = "B";
      var boardMetrics = null;
      var candidateMarkers = [];
      var chartMetric = "winrate";
      var analysisData = null;
      var reviewFocus = null;
      var viewedMoveNumber = null;
      var reviewTargets = [];
      var analysisView = "current";
      var selectedCandidateRank = 1;

      function setUploadStatus(message, isError) {
        uploadStatus.textContent = message;
        uploadStatus.classList.toggle("error-message", Boolean(isError));
      }

      function readGameSettings(required) {
        return gameSettings.read(required);
      }

      function inputErrorMessage(data) {
        var error = data && data.error;
        if (error && error.code === "missing_metadata") return "棋谱缺少规则或贴目，请补全后重新提交。";
        return data && data.detail ? String(data.detail) : "分析失败，请检查棋谱与后端服务。";
      }

      function colorName(color) {
        return color === "B" ? "黑棋" : "白棋";
      }

      function toSgf(x, y) {
        return SGF_LETTERS.charAt(x) + SGF_LETTERS.charAt(y);
      }

      function fromSgf(sgf) {
        if (typeof sgf !== "string" || sgf.length !== 2) return null;

        var x = SGF_LETTERS.indexOf(sgf.charAt(0));
        var y = SGF_LETTERS.indexOf(sgf.charAt(1));

        if (x < 0 || y < 0 || x >= BOARD_SIZE || y >= BOARD_SIZE) return null;

        return { x: x, y: y };
      }

      function fromDisplayCoord(display) {
        if (typeof display !== "string") return null;

        var normalized = display.trim().toUpperCase();
        var match = /^([A-HJ-T])\s*(\d{1,2})$/.exec(normalized);
        var x;
        var row;
        var y;

        if (!match) return null;

        x = DISPLAY_COLUMNS.indexOf(match[1]);
        row = Number(match[2]);
        y = BOARD_SIZE - row;

        if (x < 0 || row < 1 || row > BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return null;

        return { x: x, y: y };
      }

      function stoneAt(x, y) {
        return stonesByPoint[pointKey(x, y)] || null;
      }

      function pointKey(x, y) {
        return x + "," + y;
      }

      function oppositeColor(color) {
        return color === "B" ? "W" : "B";
      }

      function neighborsOf(x, y) {
        var neighbors = [];

        if (x > 0) neighbors.push({ x: x - 1, y: y });
        if (x < BOARD_SIZE - 1) neighbors.push({ x: x + 1, y: y });
        if (y > 0) neighbors.push({ x: x, y: y - 1 });
        if (y < BOARD_SIZE - 1) neighbors.push({ x: x, y: y + 1 });

        return neighbors;
      }

      function collectGroup(startX, startY) {
        var startStone = stoneAt(startX, startY);
        var stack;
        var seen;
        var group;
        var liberties;

        if (!startStone) return null;

        stack = [{ x: startX, y: startY }];
        seen = {};
        group = [];
        liberties = {};

        while (stack.length) {
          var point = stack.pop();
          var key = pointKey(point.x, point.y);

          if (seen[key]) continue;
          seen[key] = true;

          var stone = stoneAt(point.x, point.y);
          if (!stone || stone.color !== startStone.color) continue;

          group.push(stone);

          var neighbors = neighborsOf(point.x, point.y);
          for (var i = 0; i < neighbors.length; i++) {
            var neighbor = neighbors[i];
            var neighborStone = stoneAt(neighbor.x, neighbor.y);

            if (!neighborStone) {
              liberties[pointKey(neighbor.x, neighbor.y)] = true;
              continue;
            }

            if (neighborStone.color === startStone.color && !seen[pointKey(neighbor.x, neighbor.y)]) {
              stack.push(neighbor);
            }
          }
        }

        return {
          stones: group,
          libertyCount: Object.keys(liberties).length
        };
      }

      function removeStone(stone) {
        delete stonesByPoint[pointKey(stone.x, stone.y)];
        stone.isCaptured = true;
      }

      function restoreStone(stone) {
        stonesByPoint[pointKey(stone.x, stone.y)] = stone;
        stone.isCaptured = false;
      }

      function tryPlaceMove(point, color) {
        var move;
        var neighbors;
        var capturedStones;
        var seenGroups;

        if (stoneAt(point.x, point.y)) return false;

        move = {
          x: point.x,
          y: point.y,
          color: color,
          sgf: toSgf(point.x, point.y),
          captures: [],
          isCaptured: false
        };
        stonesByPoint[pointKey(point.x, point.y)] = move;

        neighbors = neighborsOf(point.x, point.y);
        capturedStones = [];
        seenGroups = {};

        for (var i = 0; i < neighbors.length; i++) {
          var neighbor = neighbors[i];
          var neighborStone = stoneAt(neighbor.x, neighbor.y);
          var groupInfo;
          var groupKey;
          var j;

          if (!neighborStone || neighborStone.color !== oppositeColor(color)) continue;

          groupKey = pointKey(neighbor.x, neighbor.y);
          if (seenGroups[groupKey]) continue;

          groupInfo = collectGroup(neighbor.x, neighbor.y);
          if (!groupInfo) continue;

          for (j = 0; j < groupInfo.stones.length; j++) {
            seenGroups[pointKey(groupInfo.stones[j].x, groupInfo.stones[j].y)] = true;
          }

          if (groupInfo.libertyCount === 0) {
            for (j = 0; j < groupInfo.stones.length; j++) {
              capturedStones.push(groupInfo.stones[j]);
            }
          }
        }

        for (var k = 0; k < capturedStones.length; k++) {
          removeStone(capturedStones[k]);
        }

        move.captures = capturedStones;

        if (collectGroup(point.x, point.y).libertyCount === 0) {
          delete stonesByPoint[pointKey(point.x, point.y)];
          return false;
        }

        moves.push(move);
        return true;
      }

      function undoLastMove() {
        var move = moves.pop();

        if (!move) return;

        delete stonesByPoint[pointKey(move.x, move.y)];

        for (var i = 0; i < move.captures.length; i++) {
          restoreStone(move.captures[i]);
        }
      }

      function updateStatus() {
        updateReviewStatus();
      }

      function updateReviewStatus() {
        var active = getActiveContext(analysisData);
        var reviewing = active && active.kind !== "current_position";
        var detail = reviewing ? findTimelineItem(analysisData, active.moveNumber) : null;
        editBtn.hidden = !analysisData;
        document.getElementById("moveCounter").textContent =
          (reviewing ? active.moveNumber : moves.length) + " / " + moves.length;
        status.textContent = analysisData ? "复盘 · " + moves.length + " 手" :
          "下一手：" + colorName(currentColor) + " | 手数：" + moves.length;
        if (!analysisData || !active) {
          reviewStatus.innerHTML = '<span class="review-badge">手动录入</span><span class="meta">19 路棋盘</span>';
          latestBtn.disabled = true;
          return;
        }
        if (!reviewing) {
          reviewStatus.innerHTML = '<span class="review-badge">记录末尾</span><span>下一手 ' +
            escapeHtml(colorName(active.nextPlayer)) + ' · 推荐 ' +
            escapeHtml(formatCoord(active.recommendedMove)) + '</span>';
          latestBtn.disabled = true;
          return;
        }
        var loss = detail && typeof detail.score_loss === "number"
          ? detail.score_loss.toFixed(2) + " 目" : "未评估";
        reviewStatus.innerHTML = '<span class="review-badge">' +
          escapeHtml(moveRefLabel(active.color, active.moveNumber)) + ' · 落子前</span>' +
          '<span class="' + (detail && detail.is_mistake ? "focus-loss" : "meta") + '">' +
          escapeHtml(detail && detail.severity_label || "目损") + ' ' + escapeHtml(loss) + '</span>' +
          '<span>实战 ' + escapeHtml(formatCoord(active.playedMove)) + ' / 推荐 ' +
          escapeHtml(formatCoord(active.recommendedMove)) + '</span>';
        latestBtn.disabled = false;
      }

      function getTimelineMoveBounds() {
        var timeline = analysisData && Array.isArray(analysisData.timeline) ? analysisData.timeline : [];

        if (!timeline.length) {
          return null;
        }

        return {
          first: typeof timeline[0].move_number === "number" ? timeline[0].move_number : 1,
          last: typeof timeline[timeline.length - 1].move_number === "number"
            ? timeline[timeline.length - 1].move_number
            : timeline.length
        };
      }

      function updateReviewNavigationControls() {
        if (isBusy) {
          prevReviewBtn.disabled = true;
          nextReviewBtn.disabled = true;
          latestBtn.disabled = true;
          return;
        }
        var bounds = getTimelineMoveBounds();
        var currentMoveNumber = getViewedMoveNumber();
        var canNavigate = Boolean(bounds && typeof currentMoveNumber === "number");

        prevReviewBtn.disabled = !canNavigate || currentMoveNumber <= bounds.first;
        nextReviewBtn.disabled = !canNavigate || currentMoveNumber >= bounds.last;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatCoord(coord) {
        if (!coord) return "暂无";
        if (typeof coord === "string") return coord;
        if (coord.display) return coord.display;
        if (coord.sgf) return coord.sgf;
        return "暂无";
      }

      function extractCoordPoint(coord) {
        if (!coord) return null;

        if (typeof coord === "string") {
          return fromSgf(coord) || fromDisplayCoord(coord);
        }

        return fromSgf(coord.sgf) || fromDisplayCoord(coord.display);
      }

      function getCurrentCandidateMarkers(data) {
        return getCandidateMarkersFromCandidates(getActiveCandidates(data));
      }

      function latestTimelineMoveNumber() {
        var bounds = getTimelineMoveBounds();
        return bounds ? bounds.last : null;
      }

      function getViewedMoveNumber() {
        if (typeof viewedMoveNumber === "number") {
          return viewedMoveNumber;
        }

        return latestTimelineMoveNumber();
      }

      function isViewingLatestMove() {
        var latestMove = latestTimelineMoveNumber();
        return typeof latestMove === "number" && getViewedMoveNumber() === latestMove;
      }

      function nextPlayerAfterMoveNumber(moveNumber) {
        if (typeof moveNumber !== "number") return null;
        return moveNumber % 2 === 0 ? "B" : "W";
      }

      function buildLatestPositionContext(data) {
        var current = data && data.current_position ? data.current_position : {};
        var latestMove = latestTimelineMoveNumber();
        var latestTimelineItem = findTimelineItem(data, latestMove) || {};

        return {
          id: "current-position",
          kind: "current_position",
          title: "最新局面",
          summary: current.short_explanation || "暂无说明。",
          moveNumber: latestMove,
          color: latestTimelineItem.color || null,
          label: "当前局面",
          playedMove: latestTimelineItem.played_move || null,
          recommendedMove: current.best_move || null,
          topCandidates: Array.isArray(current.top_candidates) ? current.top_candidates.slice(0, 3) : [],
          pvSummary: current.pv_summary || "",
          nextPlayer: current.next_player || nextPlayerAfterMoveNumber(latestMove),
          winrateOwnerColor: current.next_player || "B"
        };
      }

      function getActiveContext(data) {
        var currentMoveNumber;

        if (!data || typeof data !== "object") return null;

        currentMoveNumber = getViewedMoveNumber();
        if (reviewFocus && reviewFocus.moveNumber === currentMoveNumber) {
          return reviewFocus;
        }

        if (isViewingLatestMove()) {
          return buildLatestPositionContext(data);
        }

        return buildTimelineReviewTarget(data, currentMoveNumber);
      }

      function getCandidateMarkersFromCandidates(candidates) {
        if (!Array.isArray(candidates)) return [];

        return candidates
          .slice(0, 3)
          .map(function (candidate, index) {
            var point = extractCoordPoint(candidate && candidate.move);

            if (!point) return null;

            return {
              x: point.x,
              y: point.y,
              rank: index + 1,
              move: candidate.move
            };
          })
          .filter(Boolean);
      }

      function getActiveCandidates(data) {
        var activeContext = getActiveContext(data);
        return activeContext && Array.isArray(activeContext.topCandidates) ? activeContext.topCandidates.slice(0, 3) : [];
      }

      function candidateRankLabel(rank) {
        if (rank === 1) return "第1选择";
        if (rank === 2) return "第2选择";
        if (rank === 3) return "第3选择";
        return "候选点";
      }

      function currentCandidateContextKey() {
        var activeContext = getActiveContext(analysisData);
        return activeContext ? activeContext.kind + ":" + activeContext.id : "current";
      }

      function getSelectedCandidate(data) {
        var candidates = getActiveCandidates(data);
        var index = Math.max(0, selectedCandidateRank - 1);

        if (!candidates.length) return null;
        if (index >= candidates.length) index = 0;

        return {
          rank: index + 1,
          candidate: candidates[index]
        };
      }

      function resetSelectedCandidate(data) {
        selectedCandidateRank = getActiveCandidates(data).length ? 1 : 0;
      }

      function ensureSelectedCandidate(data) {
        var candidates = getActiveCandidates(data);

        if (!candidates.length) {
          selectedCandidateRank = 0;
          return;
        }

        if (selectedCandidateRank < 1 || selectedCandidateRank > candidates.length) {
          selectedCandidateRank = 1;
        }
      }

      function playerLabel(color) {
        if (color === "B") return "黑棋";
        if (color === "W") return "白棋";
        return color || "未知";
      }

      function moveRefLabel(color, moveNumber) {
        var shortColor = color === "B" ? "黑" : (color === "W" ? "白" : "");
        if (!shortColor) return "第" + String(moveNumber) + "手";
        return shortColor + "第" + String(moveNumber) + "手";
      }



      function renderRawJson(data) {
        output.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      }

      function setAnalyzeLoadingState(isLoading) {
        setBusy(isLoading);
        analyzeBtn.querySelector("span").textContent = isLoading ? "分析中…" : "开始分析";
      }

      function setUploadLoadingState(isLoading) {
        setBusy(isLoading);
        uploadAnalyzeBtn.querySelector("span").textContent = isLoading ? "分析中…" : "上传并分析";
      }

      function setBusy(value) {
        isBusy = value;
        [analyzeBtn, uploadAnalyzeBtn, undoBtn, clearBtn, editBtn, sgfFileInput,
          document.getElementById("rulesInput"), document.getElementById("komiInput"),
          document.getElementById("customRulesInput")].forEach(function (control) {
            control.disabled = value;
          });
        summary.setAttribute("aria-busy", String(value));
        updateReviewNavigationControls();
      }

      function renderLoadingState() {
        summary.innerHTML = [
          "<div class=\"loading-state\">",
          "<div class=\"loading-spinner\" aria-hidden=\"true\"></div>",
          "<div class=\"loading-text\">正在分析当前局面，请稍候</div>",
          "</div>"
        ].join("");
      }

      function renderErrorState(message) {
        summary.innerHTML = "<div class=\"error-message\">" + escapeHtml(message) + "</div>";
      }

      function clearAnalysisState() {
        analysisData = null;
        reviewFocus = null;
        viewedMoveNumber = null;
        reviewTargets = [];
        candidateMarkers = [];
        selectedCandidateRank = 1;
        chartMetric = "winrate";
        summary.textContent = "暂无分析结果。";
        output.textContent = "暂无分析数据。";
        setUploadStatus("", false);
        updateReviewStatus();
        updateReviewNavigationControls();
      }

      function resetBoardState() {
        moves = [];
        stonesByPoint = {};
        currentColor = "B";
      }

      function appendPassMove(color) {
        moves.push({
          color: color,
          sgf: null,
          captures: [],
          isCaptured: false,
          isPass: true
        });
        currentColor = oppositeColor(color);
      }

      function rebuildBoardFromTimeline(timeline) {
        resetBoardState();

        if (!Array.isArray(timeline)) {
          return;
        }

        for (var i = 0; i < timeline.length; i++) {
          var item = timeline[i];
          var point = extractCoordPoint(item && item.played_move);
          var color = item && item.color ? item.color : currentColor;

          if (!point) {
            appendPassMove(color);
            continue;
          }

          if (!tryPlaceMove(point, color)) {
            throw new Error("无法根据返回的 SGF 分析结果重建第" + String(i + 1) + "手棋盘。");
          }

          currentColor = oppositeColor(color);
        }
      }

      function applyAnalysisResult(data) {
        if (data.schema_version !== "3.0") throw new Error("报告版本不兼容，请更新后端后重新分析。");
        if (data.game_summary) {
          gameSettings.apply(data.game_summary);
        }
        analysisData = data;
        reviewTargets = buildReviewTargets(data);
        reviewFocus = reviewTargets[0] || null;
        viewedMoveNumber = reviewFocus ? reviewFocus.moveNumber : latestTimelineMoveNumber();
        resetSelectedCandidate(data);
        candidateMarkers = getCurrentCandidateMarkers(data);
        chartMetric = "winrate";
        drawBoard();
        updateStatus();
        updateReviewStatus();
        updateReviewNavigationControls();
        renderAnalysisSummary(data);
        renderRawJson(data);
      }

      function syncAnalysisViewButtons() {
        Array.prototype.forEach.call(analysisViewSwitch.querySelectorAll("[data-analysis-view]"), function (button) {
          var isActive = button.getAttribute("data-analysis-view") === analysisView;
          button.classList.toggle("active", isActive);
          button.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      function setAnalysisView(view) {
        if (isBusy) return;
        analysisView = view === "review" ? "review" : "current";
        syncAnalysisViewButtons();

        if (analysisData) {
          renderAnalysisSummary(analysisData);
        }
      }

      function findTimelineItem(data, moveNumber) {
        var timeline = data && Array.isArray(data.timeline) ? data.timeline : [];

        for (var i = 0; i < timeline.length; i++) {
          if (timeline[i] && timeline[i].move_number === moveNumber) {
            return timeline[i];
          }
        }

        return null;
      }

      function findReviewMistake(data, moveNumber) {
        var selected = data && data.review && Array.isArray(data.review.mistakes_above_threshold)
          ? data.review.mistakes_above_threshold
          : [];

        for (var i = 0; i < selected.length; i++) {
          if (selected[i] && selected[i].move_number === moveNumber) {
            return selected[i];
          }
        }

        return null;
      }

      function buildReviewTarget(data, config) {
        var detail = findReviewMistake(data, config.moveNumber) || findTimelineItem(data, config.moveNumber) || {};
        var topCandidates = Array.isArray(detail.top_candidates) ? detail.top_candidates : [];

        return {
          id: config.id,
          kind: config.kind,
          title: config.title,
          summary: config.summary,
          moveNumber: config.moveNumber,
          color: config.color || detail.color || null,
          label: config.label,
          playedMove: detail.played_move || config.playedMove || null,
          recommendedMove: detail.recommended_move || detail.best_move || config.recommendedMove || null,
          topCandidates: topCandidates,
          pvSummary: detail.pv_summary || "",
          nextPlayer: config.color || detail.color,
          winrateOwnerColor: config.color || detail.color || null
        };
      }

      function buildTimelineReviewSummary(detail) {
        return detail && detail.summary || "该手证据不可用。";
      }

      function buildTimelineReviewTarget(data, moveNumber) {
        var detail = findTimelineItem(data, moveNumber);
        var mistake = findReviewMistake(data, moveNumber) || {};
        if (!detail) return null;
        var topCandidates = Array.isArray(mistake.top_candidates)
          ? mistake.top_candidates
          : (Array.isArray(detail.top_candidates) ? detail.top_candidates : []);

        if (!detail || typeof detail.move_number !== "number") {
          return null;
        }

        return {
          id: "timeline-" + detail.move_number,
          kind: "timeline_point",
          title: "走势定位",
          summary: buildTimelineReviewSummary(detail),
          moveNumber: detail.move_number,
          color: detail.color || null,
          label: detail.severity_label || (detail.is_mistake === null ? "未评估" : "未达失误阈值"),
          playedMove: detail.played_move || null,
          recommendedMove: mistake.recommended_move || detail.recommended_move || null,
          topCandidates: topCandidates,
          pvSummary: mistake.pv_summary || detail.pv_summary || "",
          nextPlayer: detail.color,
          winrateOwnerColor: detail.color || null
        };
      }

      function buildReviewTargets(data) {
        return (data.selected_mistakes || []).map(function (item) {
          return buildReviewTarget(data, {
            id: "mistake-" + item.move_number,
            kind: "mistake",
            title: item.severity_label,
            summary: item.summary,
            moveNumber: item.move_number,
            color: item.color,
            label: (item.quality_notes || []).join(" ")
          });
        });
      }

      function renderReviewTargetList(items, emptyText) {
        if (!items.length) {
          return "<div>" + escapeHtml(emptyText) + "</div>";
        }

        return "<ul>" + items.map(function (item) {
          var isActive = reviewFocus && reviewFocus.id === item.id;

          return [
            "<li>",
            "<button type=\"button\" class=\"review-item-button" + (isActive ? " active" : "") + "\" data-review-id=\"" + escapeHtml(item.id) + "\">",
            "<strong>" + escapeHtml(item.title) + " · " + escapeHtml(moveRefLabel(item.color, item.moveNumber)) + "</strong>",
            "<span>" + escapeHtml(item.summary) + "</span>",
            "<span class=\"review-item-meta\">",
            "实战 " + escapeHtml(formatCoord(item.playedMove)) +
            " | 推荐 " + escapeHtml(formatCoord(item.recommendedMove)) +
            (item.label ? " | " + escapeHtml(item.label) : ""),
            "</span>",
            "</button>",
            "</li>"
          ].join("");
        }).join("") + "</ul>";
      }

      function activateReviewTargetById(targetId) {
        var target = null;

        for (var i = 0; i < reviewTargets.length; i++) {
          if (reviewTargets[i].id === targetId) {
            target = reviewTargets[i];
            break;
          }
        }

        if (!target) return;

        reviewFocus = target;
        viewedMoveNumber = target.moveNumber;
        resetSelectedCandidate(analysisData);
        candidateMarkers = getCandidateMarkersFromCandidates(target.topCandidates);
        drawBoard();
        updateReviewStatus();
        updateReviewNavigationControls();
        renderAnalysisSummary(analysisData);
      }

      function activateTimelineMove(moveNumber) {
        var target;
        var latestMove;

        if (!analysisData) return;
        latestMove = latestTimelineMoveNumber();
        if (typeof latestMove !== "number") return;
        if (moveNumber < 1 || moveNumber > latestMove) return;

        viewedMoveNumber = moveNumber;
        target = buildTimelineReviewTarget(analysisData, moveNumber);
        reviewFocus = target;
        resetSelectedCandidate(analysisData);
        candidateMarkers = target ? getCandidateMarkersFromCandidates(target.topCandidates) : [];
        drawBoard();
        updateReviewStatus();
        updateReviewNavigationControls();
        renderAnalysisSummary(analysisData);
      }

      function returnToLatestBoardState() {
        reviewFocus = null;
        viewedMoveNumber = latestTimelineMoveNumber();
        resetSelectedCandidate(analysisData);
        candidateMarkers = getCurrentCandidateMarkers(analysisData);
        drawBoard();
        updateReviewStatus();
        updateReviewNavigationControls();
        renderAnalysisSummary(analysisData);
      }

      function stepReviewPosition(offset) {
        var nextMoveNumber;

        if (!analysisData || !offset) return;

        nextMoveNumber = getViewedMoveNumber() + offset;
        activateTimelineMove(nextMoveNumber);
      }

      function shouldIgnoreReviewKeydown(event) {
        var target = event.target;
        var tagName;

        if (!target) return false;

        tagName = target.tagName;
        return target.isContentEditable || tagName === "INPUT" || tagName === "TEXTAREA" || tagName === "SELECT";
      }

      function candidateDeltaText(activeCandidates, rank, candidate) {
        var best = activeCandidates && activeCandidates[0];
        if (rank === 1) return "引擎第 1 推荐。";
        if (!best) return "对比证据不可用。";
        var parts = [];
        if (typeof best.score_estimate === "number" && typeof candidate.score_estimate === "number") {
          parts.push("相对第 1 推荐目差变化 " + (candidate.score_estimate - best.score_estimate).toFixed(2) + " 目");
        }
        if (typeof best.winrate === "number" && typeof candidate.winrate === "number") {
          parts.push("胜率变化 " + ((candidate.winrate - best.winrate) * 100).toFixed(2) + " 个百分点");
        }
        return parts.length ? parts.join("；") + "。搜索估计可能存在噪声。" : "对比证据不可用。";
      }

      function buildCandidateExplanation(data) {
        var selected = getSelectedCandidate(data);
        var activeCandidates = getActiveCandidates(data);
        var activeContext = getActiveContext(data);
        var candidate;
        var rankLabel;
        var scoreText;
        var winrateText;
        var pvText;
        var winrateLabel = winrateLabelForColor(activeContext && activeContext.winrateOwnerColor);

        if (!selected) {
          return "<div>暂无候选点说明。</div>";
        }

        candidate = selected.candidate;
        rankLabel = candidateRankLabel(selected.rank);
        scoreText = typeof candidate.score_estimate === "number"
          ? candidate.score_estimate.toFixed(2) + "目"
          : "暂无目差";
        winrateText = typeof candidate.winrate === "number"
          ? (candidate.winrate * 100).toFixed(1) + "%"
          : "暂无胜率";

        if (Array.isArray(candidate.pv) && candidate.pv.length) {
          pvText = candidate.pv.map(function (step) {
            var point = fromSgf(step.move);
            var coord = point ? DISPLAY_COLUMNS.charAt(point.x) + String(BOARD_SIZE - point.y) : step.move;
            return (step.color === "B" ? "黑" : "白") + coord;
          }).join(" -> ");
        } else {
          pvText = "暂无完整PV，只展示候选点本身的胜率与目差。";
        }

        return [
          "<div class=\"candidate-detail-panel\" data-candidate-context=\"" + escapeHtml(currentCandidateContextKey()) + "\">",
          "<div class=\"candidate-detail-title\">",
          "<span class=\"candidate-rank-badge\">" + escapeHtml(rankLabel) + "</span>",
          "<strong>" + escapeHtml(formatCoord(candidate.move)) + "</strong>",
          "</div>",
          "<p>" + escapeHtml(winrateLabel) + "：" + escapeHtml(winrateText) + "；" + escapeHtml(playerLabel(activeContext && activeContext.winrateOwnerColor)) + "目差：" + escapeHtml(scoreText) + "。</p>",
          "<p>" + escapeHtml(candidateDeltaText(activeCandidates, selected.rank, candidate)) + "</p>",
          "<p>变化参考：" + escapeHtml(pvText) + "</p>",
          "</div>"
        ].join("");
      }

      function renderCandidateChoiceList(activeCandidates) {
        var activeContext = getActiveContext(analysisData);
        var winrateLabel = winrateLabelForColor(activeContext && activeContext.winrateOwnerColor);

        if (!activeCandidates.length) {
          return "<div>暂无候选点。</div>";
        }

        return [
          "<div class=\"candidate-choice-list\">",
          activeCandidates.map(function (candidate, index) {
            var rank = index + 1;
            var isActive = rank === selectedCandidateRank;

            return [
              "<button type=\"button\" class=\"candidate-choice-button" + (isActive ? " active" : "") + "\" data-candidate-rank=\"" + rank + "\">",
              "<span class=\"candidate-choice-rank\">" + escapeHtml(candidateRankLabel(rank)) + "</span>",
              "<strong>" + escapeHtml(formatCoord(candidate.move)) + "</strong>",
              "<span class=\"candidate-choice-meta\">" + escapeHtml(winrateLabel) + "约" +
                escapeHtml(typeof candidate.winrate === "number" ? (candidate.winrate * 100).toFixed(1) : "暂无") +
                "%，目差约" +
                escapeHtml(typeof candidate.score_estimate === "number" ? String(Math.round(candidate.score_estimate * 10) / 10) : "暂无") +
                "</span>",
              "</button>"
            ].join("");
          }).join(""),
          "</div>"
        ].join("");
      }

      function hasTrendMetric(timeline, metric) {
        if (!timeline || !timeline.length) return false;

        return timeline.some(function (item) {
          return item && typeof item[metric] === "number";
        });
      }

      function buildTrendSeries(timeline, metric) {
        if (!timeline || !timeline.length) return [];

        return timeline
          .map(function (item) {
            if (!item || typeof item.move_number !== "number" || typeof item[metric] !== "number") {
              return null;
            }

            return {
              moveNumber: item.move_number,
              value: item[metric]
            };
          })
          .filter(Boolean);
      }

      function formatTrendValue(metric, value) {
        if (metric === "winrate") {
          return (value * 100).toFixed(1) + "%";
        }

        var rounded = Math.round(value * 10) / 10;
        return String(rounded);
      }

      function perspectiveWinrate(item, perspectiveColor) {
        if (item && typeof item.winrate_black_after === "number") {
          return perspectiveColor === "B" ? item.winrate_black_after : 1 - item.winrate_black_after;
        }
        if (!item || typeof item.winrate_after !== "number") return null;
        if (item.color === perspectiveColor) return item.winrate_after;
        return 1 - item.winrate_after;
      }

      function winrateLabelForColor(color) {
        return color === "W" ? "白棋胜率" : "黑棋胜率";
      }


      function winrateIndicatorHtml(color) {
        var normalized = color === "W" ? "W" : "B";
        return [
          "<span class=\"winrate-indicator\">",
          "<span class=\"winrate-indicator-dot " + (normalized === "W" ? "white" : "black") + "\" aria-hidden=\"true\"></span>",
          escapeHtml(winrateLabelForColor(normalized)),
          "</span>"
        ].join("");
      }


      function linePath(points) {
        return trendPath(points);
      }

      function renderTrendChart(timeline) {
        var container = document.getElementById("trendChartSection");
        if (!container) return;

        var hasWinrate = hasTrendMetric(timeline, "winrate_after");
        var hasScore = hasTrendMetric(timeline, "score_black_after");
        var activeMetric = chartMetric;
        var series;
        var minValue;
        var maxValue;
        var width;
        var height;
        var padding;
        var points;
        var path;
        var axisLabels;
        var firstPoint;
        var lastPoint;
        var selectedMoveNumber = getViewedMoveNumber();
        var winratePerspectiveColor = "B";
        var winrateTitle = winrateLabelForColor(winratePerspectiveColor);

        if (!hasWinrate && !hasScore) {
          container.innerHTML = "<div>暂无可绘制的走势数据。</div>";
          return;
        }

        if (activeMetric === "winrate" && !hasWinrate) activeMetric = "score";
        if (activeMetric === "score" && !hasScore) activeMetric = "winrate";
        chartMetric = activeMetric;

        series = activeMetric === "winrate"
          ? timeline
              .map(function (item) {
                var value = perspectiveWinrate(item, winratePerspectiveColor);

                if (!item || typeof item.move_number !== "number" || typeof value !== "number") {
                  return null;
                }

                return {
                  moveNumber: item.move_number,
                  value: value
                };
              })
              .filter(Boolean)
          : buildTrendSeries(timeline, "score_black_after");
        if (!series.length) {
          container.innerHTML = "<div>暂无可绘制的走势数据。</div>";
          return;
        }

        minValue = series[0].value;
        maxValue = series[0].value;
        for (var i = 1; i < series.length; i++) {
          minValue = Math.min(minValue, series[i].value);
          maxValue = Math.max(maxValue, series[i].value);
        }

        if (minValue === maxValue) {
          minValue -= activeMetric === "winrate" ? 0.02 : 1;
          maxValue += activeMetric === "winrate" ? 0.02 : 1;
        }

        width = 300;
        height = 160;
        padding = { top: 12, right: 12, bottom: 28, left: 36 };
        points = series.map(function (item, index) {
          var x;
          var y;
          var xSpan = Math.max(1, timeline.length - 1);
          var ySpan = maxValue - minValue;

          x = padding.left + ((width - padding.left - padding.right) * (item.moveNumber - 1)) / xSpan;
          y = padding.top + ((height - padding.top - padding.bottom) * (maxValue - item.value)) / ySpan;

          return {
            x: Math.round(x * 10) / 10,
            y: Math.round(y * 10) / 10,
            moveNumber: item.moveNumber,
            value: item.value,
            isSelected: item.moveNumber === selectedMoveNumber
          };
        });
        path = linePath(points);
        axisLabels = [
          formatTrendValue(activeMetric, maxValue),
          formatTrendValue(activeMetric, (minValue + maxValue) / 2),
          formatTrendValue(activeMetric, minValue)
        ];
        firstPoint = points[0];
        lastPoint = points[points.length - 1];

        container.innerHTML = [
          "<div class=\"chart-controls\">",
          hasWinrate ? "<button type=\"button\" data-chart-metric=\"winrate\" class=\"" + (activeMetric === "winrate" ? "active" : "") + "\">胜率</button>" : "",
          hasScore ? "<button type=\"button\" data-chart-metric=\"score\" class=\"" + (activeMetric === "score" ? "active" : "") + "\">目差</button>" : "",
          "</div>",
          "<div class=\"section-title-row\">",
          "<strong>" + escapeHtml(activeMetric === "winrate" ? "胜率走势" : "目差走势") + "</strong>",
          (activeMetric === "winrate" ? winrateIndicatorHtml(winratePerspectiveColor) : ""),
          "</div>",
          "<div class=\"trend-chart\">",
          "<svg viewBox=\"0 0 " + width + " " + height + "\" role=\"img\" aria-label=\"走势折线图\">",
          "<line x1=\"" + padding.left + "\" y1=\"" + padding.top + "\" x2=\"" + padding.left + "\" y2=\"" + (height - padding.bottom) + "\" stroke=\"#999\" stroke-width=\"1\" />",
          "<line x1=\"" + padding.left + "\" y1=\"" + (height - padding.bottom) + "\" x2=\"" + (width - padding.right) + "\" y2=\"" + (height - padding.bottom) + "\" stroke=\"#999\" stroke-width=\"1\" />",
          "<line x1=\"" + padding.left + "\" y1=\"" + (padding.top + (height - padding.top - padding.bottom) / 2) + "\" x2=\"" + (width - padding.right) + "\" y2=\"" + (padding.top + (height - padding.top - padding.bottom) / 2) + "\" stroke=\"#ddd\" stroke-width=\"1\" />",
          "<path d=\"" + path + "\" fill=\"none\" stroke=\"#2f6db3\" stroke-width=\"2\" />",
          points.map(function (point) {
            return [
              "<circle",
              " cx=\"" + point.x + "\"",
              " cy=\"" + point.y + "\"",
              " r=\"" + (point.isSelected ? "7" : "5") + "\"",
              " fill=\"" + (point.isSelected ? "#c74b16" : "#ffffff") + "\"",
              " stroke=\"" + (point.isSelected ? "#c74b16" : "#2f6db3") + "\"",
              " stroke-width=\"" + (point.isSelected ? "3" : "2") + "\"",
              " data-chart-move=\"" + point.moveNumber + "\"",
              " tabindex=\"0\"",
              " role=\"button\"",
              " aria-label=\"跳转到第" + point.moveNumber + "手\"",
              " style=\"cursor:pointer\"",
              "><title>第" + point.moveNumber + "手: " + formatTrendValue(activeMetric, point.value) + (point.isSelected ? "（当前选中）" : "") + "</title></circle>"
            ].join("");
          }).join(""),
          "<text x=\"6\" y=\"" + (padding.top + 4) + "\" font-size=\"10\" fill=\"#555\">" + escapeHtml(axisLabels[0]) + "</text>",
          "<text x=\"6\" y=\"" + (padding.top + (height - padding.top - padding.bottom) / 2 + 4) + "\" font-size=\"10\" fill=\"#555\">" + escapeHtml(axisLabels[1]) + "</text>",
          "<text x=\"6\" y=\"" + (height - padding.bottom + 4) + "\" font-size=\"10\" fill=\"#555\">" + escapeHtml(axisLabels[2]) + "</text>",
          "<text x=\"" + firstPoint.x + "\" y=\"" + (height - 8) + "\" text-anchor=\"middle\" font-size=\"10\" fill=\"#555\">第" + firstPoint.moveNumber + "手</text>",
          (lastPoint.moveNumber !== firstPoint.moveNumber
            ? "<text x=\"" + lastPoint.x + "\" y=\"" + (height - 8) + "\" text-anchor=\"middle\" font-size=\"10\" fill=\"#555\">第" + lastPoint.moveNumber + "手</text>"
            : ""),
          "</svg>",
          "</div>",
          "<div class=\"chart-meta\">",
          escapeHtml(activeMetric === "winrate" ? "显示每手实战后的" + winrateTitle + "走势。" : "每手实战后目差（正数为黑棋领先）。"),
          " 共 " + escapeHtml(String(series.length)) + " 个点。",
          typeof selectedMoveNumber === "number" ? " 当前选中第" + escapeHtml(String(selectedMoveNumber)) + "手。" : " 当前显示最新局面。",
          "</div>",
          "<div class=\"chart-note\">缺失评估处断线；目差为引擎估计。</div>"
        ].join("");

        Array.prototype.forEach.call(container.querySelectorAll("[data-chart-metric]"), function (button) {
          button.addEventListener("click", function () {
            chartMetric = this.getAttribute("data-chart-metric");
            renderTrendChart(timeline);
          });
        });

        Array.prototype.forEach.call(container.querySelectorAll("[data-chart-move]"), function (pointButton) {
          function activatePoint() {
            activateTimelineMove(Number(pointButton.getAttribute("data-chart-move")));
          }

          pointButton.addEventListener("click", activatePoint);
          pointButton.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              activatePoint();
            }
          });
        });
      }

      function renderAnalysisSummary(data) {
        if (!data || data.schema_version !== "3.0") {
          renderErrorState("报告版本不兼容，请更新后端后重新分析。");
          return;
        }
        var active = getActiveContext(data);
        var candidates = getActiveCandidates(data);
        var timeline = data.timeline;
        var detail = active && active.kind !== "current_position"
          ? findTimelineItem(data, active.moveNumber) : data.current_position;
        ensureSelectedCandidate(data);
        var overview = renderReportOverview(data);
        var empty = data.status === "partial" ? "可用证据中暂无明显失误；不能据此判断整盘无失误。" : "当前阈值下未发现明显失误。";
        var top = '<section class="analysis-section"><h3>重点失误</h3>' +
          renderReviewTargetList(reviewTargets, empty) + '</section>';
        var position = '<section class="analysis-section"><h3>' +
          escapeHtml(active && active.kind !== "current_position" ? moveRefLabel(active.color, active.moveNumber) + " · 落子前" : "记录末尾局面") +
          '</h3><p>' + escapeHtml(active ? active.summary : "证据不可用。") + '</p>' +
          '<p>' + (active && active.kind !== "current_position" ? '实战：' + escapeHtml(formatCoord(active.playedMove)) + '；' : '') +
          '推荐：' + escapeHtml(formatCoord(active && active.recommendedMove)) + '</p>' +
          renderQualityNotes(detail) + '</section>' +
          '<section class="analysis-section"><div class="section-title-row"><h3>候选点</h3>' +
          winrateIndicatorHtml(active && active.winrateOwnerColor) + '</div>' +
          renderCandidateChoiceList(candidates) + buildCandidateExplanation(data) + '</section>';
        var trend = '<section class="analysis-section"><h3>黑棋评估走势</h3><div id="trendChartSection"></div></section>';
        summary.innerHTML = overview + (analysisView === "review"
          ? top + renderMistakeMarkers(data) + position + trend
          : position + top + renderMistakeMarkers(data) + trend);
        renderTrendChart(timeline);
        Array.prototype.forEach.call(summary.querySelectorAll("[data-review-id]"), function (button) {
          button.addEventListener("click", function () {
            activateReviewTargetById(this.getAttribute("data-review-id"));
            revealBoardOnMobile();
          });
        });
        Array.prototype.forEach.call(summary.querySelectorAll("[data-review-move]"), function (button) {
          button.addEventListener("click", function () {
            activateTimelineMove(Number(this.getAttribute("data-review-move")));
            revealBoardOnMobile();
          });
        });
        Array.prototype.forEach.call(summary.querySelectorAll("[data-candidate-rank]"), function (button) {
          button.addEventListener("click", function () {
            selectedCandidateRank = Number(this.getAttribute("data-candidate-rank")) || 1;
            if (selectedCandidateRank > 1) showCandidates.checked = true;
            drawBoard();
            renderAnalysisSummary(data);
          });
        });
      }

      function revealBoardOnMobile() {
        if (window.matchMedia("(max-width: 900px)").matches) {
          document.querySelector(".board-column").scrollIntoView({ block: "start" });
        }
      }

      function createBoardSnapshot(uptoMoveCount) {
        var snapshot = {
          stonesByPoint: {},
          moves: []
        };

        function snapshotStoneAt(x, y) {
          return snapshot.stonesByPoint[pointKey(x, y)] || null;
        }

        function collectSnapshotGroup(startX, startY) {
          var startStone = snapshotStoneAt(startX, startY);
          var stack;
          var seen;
          var group;
          var liberties;

          if (!startStone) return null;

          stack = [{ x: startX, y: startY }];
          seen = {};
          group = [];
          liberties = {};

          while (stack.length) {
            var point = stack.pop();
            var key = pointKey(point.x, point.y);
            var stone;
            var neighbors;
            var i;

            if (seen[key]) continue;
            seen[key] = true;

            stone = snapshotStoneAt(point.x, point.y);
            if (!stone || stone.color !== startStone.color) continue;

            group.push(stone);
            neighbors = neighborsOf(point.x, point.y);
            for (i = 0; i < neighbors.length; i++) {
              var neighbor = neighbors[i];
              var neighborStone = snapshotStoneAt(neighbor.x, neighbor.y);

              if (!neighborStone) {
                liberties[pointKey(neighbor.x, neighbor.y)] = true;
                continue;
              }

              if (neighborStone.color === startStone.color && !seen[pointKey(neighbor.x, neighbor.y)]) {
                stack.push(neighbor);
              }
            }
          }

          return {
            stones: group,
            libertyCount: Object.keys(liberties).length
          };
        }

        function applySnapshotMove(sourceMove) {
          var point = extractCoordPoint(sourceMove && (sourceMove.sgf || sourceMove.played_move));
          var move;
          var neighbors;
          var capturedStones;
          var seenGroups;
          var i;

          if (!point) {
            snapshot.moves.push({
              color: sourceMove.color,
              sgf: null,
              captures: [],
              isCaptured: false,
              isPass: true
            });
            return;
          }

          move = {
            x: point.x,
            y: point.y,
            color: sourceMove.color,
            sgf: toSgf(point.x, point.y),
            captures: [],
            isCaptured: false,
            isPass: false
          };
          snapshot.stonesByPoint[pointKey(point.x, point.y)] = move;

          neighbors = neighborsOf(point.x, point.y);
          capturedStones = [];
          seenGroups = {};

          for (i = 0; i < neighbors.length; i++) {
            var neighbor = neighbors[i];
            var neighborStone = snapshotStoneAt(neighbor.x, neighbor.y);
            var groupInfo;
            var groupKey;
            var j;

            if (!neighborStone || neighborStone.color !== oppositeColor(sourceMove.color)) continue;

            groupKey = pointKey(neighbor.x, neighbor.y);
            if (seenGroups[groupKey]) continue;

            groupInfo = collectSnapshotGroup(neighbor.x, neighbor.y);
            if (!groupInfo) continue;

            for (j = 0; j < groupInfo.stones.length; j++) {
              seenGroups[pointKey(groupInfo.stones[j].x, groupInfo.stones[j].y)] = true;
            }

            if (groupInfo.libertyCount === 0) {
              for (j = 0; j < groupInfo.stones.length; j++) {
                capturedStones.push(groupInfo.stones[j]);
              }
            }
          }

          for (i = 0; i < capturedStones.length; i++) {
            delete snapshot.stonesByPoint[pointKey(capturedStones[i].x, capturedStones[i].y)];
            capturedStones[i].isCaptured = true;
          }

          move.captures = capturedStones;
          snapshot.moves.push(move);
        }

        for (var i = 0; i < Math.min(uptoMoveCount, moves.length); i++) {
          applySnapshotMove(moves[i]);
        }

        return snapshot;
      }

      function syncCanvasSize() {
        var rect = boardElement.getBoundingClientRect();
        var size = Math.floor(rect.width || boardElement.clientWidth || 640);
        var ratio = window.devicePixelRatio || 1;
        canvas.width = size * ratio;
        canvas.height = size * ratio;
        canvas.style.width = size + "px";
        canvas.style.height = size + "px";
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        boardMetrics = {
          size: size,
          padding: size * 0.075,
          cell: (size - size * 0.15) / (BOARD_SIZE - 1)
        };
        drawBoard();
      }

      function boardPoint(index) {
        return boardMetrics.padding + index * boardMetrics.cell;
      }

      function drawGrid() {
        context.strokeStyle = "#87704a";
        context.lineWidth = 1;

        for (var i = 0; i < BOARD_SIZE; i++) {
          var pos = boardPoint(i);
          var start = boardPoint(0);
          var end = boardPoint(BOARD_SIZE - 1);

          context.beginPath();
          context.moveTo(start, pos);
          context.lineTo(end, pos);
          context.stroke();

          context.beginPath();
          context.moveTo(pos, start);
          context.lineTo(pos, end);
          context.stroke();
        }
      }

      function drawStarPoints() {
        context.fillStyle = "#5d3c1a";

        for (var y = 0; y < STAR_POINTS.length; y++) {
          for (var x = 0; x < STAR_POINTS.length; x++) {
            context.beginPath();
            context.arc(boardPoint(STAR_POINTS[x]), boardPoint(STAR_POINTS[y]), Math.max(3, boardMetrics.cell * 0.1), 0, Math.PI * 2);
            context.fill();
          }
        }
      }

      function drawStone(move, moveNumber, isLatestMove) {
        var x = boardPoint(move.x);
        var y = boardPoint(move.y);
        var radius = boardMetrics.cell * 0.45;
        var gradient = context.createRadialGradient(x - radius * 0.35, y - radius * 0.35, radius * 0.1, x, y, radius);
        var label = String(moveNumber);
        var isViewedMove = analysisData && moveNumber === getViewedMoveNumber();

        if (move.color === "B") {
          gradient.addColorStop(0, "#666");
          gradient.addColorStop(1, "#111");
        } else {
          gradient.addColorStop(0, "#fff");
          gradient.addColorStop(1, "#d8d8d8");
        }

        context.fillStyle = gradient;
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = move.color === "B" ? "#000" : "#999";
        context.stroke();

        if (isLatestMove) {
          context.save();
          context.strokeStyle = isViewedMove ? "#c74b16" : (move.color === "B" ? "#f5d36b" : "#b85c00");
          context.lineWidth = Math.max(2, boardMetrics.cell * (isViewedMove ? 0.11 : 0.08));
          context.beginPath();
          context.arc(x, y, radius * 0.78, 0, Math.PI * 2);
          context.stroke();

          if (isViewedMove) {
            context.strokeStyle = "rgba(199, 75, 22, 0.28)";
            context.lineWidth = Math.max(4, boardMetrics.cell * 0.14);
            context.beginPath();
            context.arc(x, y, radius * 1.05, 0, Math.PI * 2);
            context.stroke();
          }
          context.restore();
        }

        if (!showMoveNumbers.checked) return;
        context.save();
        context.fillStyle = move.color === "B" ? "#f4f4f4" : "#111";
        context.font = "bold " + Math.max(10, Math.floor(radius * (label.length > 2 ? 0.9 : 1.1))) + "px sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(label, x, y + 0.5);
        context.restore();
      }

      function drawBoardMarker(marker) {
        var x = boardPoint(marker.x);
        var y = boardPoint(marker.y);
        var radius = boardMetrics.cell * 0.43;
        var isBest = marker.kind === "recommended" || marker.kind === "combined";
        var isPlayed = marker.kind === "played" || marker.kind === "mistake";
        var fill = isBest ? "#087a59" : marker.kind === "mistake" ? "#c13545"
          : isPlayed ? "#505b60" : "#2369bb";
        context.save();
        context.translate(x, y);
        context.beginPath();
        if (isBest) {
          context.moveTo(0, -radius * 1.1);
          context.lineTo(radius, radius * 0.85);
          context.lineTo(-radius, radius * 0.85);
          context.closePath();
        } else if (isPlayed) {
          context.rect(-radius * 0.88, -radius * 0.88, radius * 1.76, radius * 1.76);
        } else {
          context.arc(0, 0, radius * 0.88, 0, Math.PI * 2);
        }
        // A dark outer edge and white keyline stay visible on both stone colors.
        context.strokeStyle = marker.selected ? "#172f31" : "rgba(23,47,49,0.3)";
        context.lineWidth = marker.selected ? 4 : 3;
        context.stroke();
        context.fillStyle = fill;
        context.fill();
        context.strokeStyle = "#fff";
        context.lineWidth = 1.5;
        context.stroke();
        context.fillStyle = "#fff";
        context.font = "700 " + Math.max(9, Math.floor(boardMetrics.cell * 0.47)) + "px sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(marker.label, 0, isBest ? radius * 0.23 : 0.5);
        context.restore();
      }

      function trySelectCandidateAtPoint(point) {
        for (var i = 0; i < visibleMarkers.length; i++) {
          if (visibleMarkers[i].rank && visibleMarkers[i].x === point.x && visibleMarkers[i].y === point.y) {
            selectedCandidateRank = visibleMarkers[i].rank;
            drawBoard();
            renderAnalysisSummary(analysisData);
            return true;
          }
        }

        return false;
      }

      function drawCoordinates() {
        context.save();
        context.font = Math.max(9, Math.min(12, boardMetrics.cell * 0.36)) + "px sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillStyle = "#635134";
        var edge = boardMetrics.padding * 0.38;
        for (var i = 0; i < BOARD_SIZE; i++) {
          context.fillText(DISPLAY_COLUMNS[i], boardPoint(i), edge);
          context.fillText(DISPLAY_COLUMNS[i], boardPoint(i), boardMetrics.size - edge);
          context.fillText(String(BOARD_SIZE - i), edge, boardPoint(i));
          context.fillText(String(BOARD_SIZE - i), boardMetrics.size - edge, boardPoint(i));
        }
        context.restore();
      }

      function drawBoard() {
        var activeMoves = [];
        var activeContext = getActiveContext(analysisData);
        var renderedMoveCount = activeContext && activeContext.kind !== "current_position"
          ? activeContext.moveNumber - 1 : moves.length;
        var snapshot = createBoardSnapshot(renderedMoveCount);
        var recommendedMove = activeContext ? activeContext.recommendedMove : null;
        var i;

        if (!boardMetrics) return;

        context.clearRect(0, 0, boardMetrics.size, boardMetrics.size);
        context.fillStyle = "#e7c990";
        context.fillRect(0, 0, boardMetrics.size, boardMetrics.size);
        drawGrid();
        drawStarPoints();
        drawCoordinates();

        for (i = 0; i < snapshot.moves.length; i++) {
          if (!snapshot.moves[i].isCaptured && !snapshot.moves[i].isPass) {
            activeMoves.push({
              move: snapshot.moves[i],
              moveNumber: i + 1
            });
          }
        }

        for (i = 0; i < activeMoves.length; i++) {
          drawStone(activeMoves[i].move, activeMoves[i].moveNumber, activeMoves[i].moveNumber === renderedMoveCount);
        }

        var reviewing = activeContext && activeContext.kind !== "current_position";
        var detail = reviewing ? findTimelineItem(analysisData, activeContext.moveNumber) : null;
        visibleMarkers = buildBoardMarkers({
          candidates: candidateMarkers,
          played: reviewing ? extractCoordPoint(activeContext.playedMove) : null,
          recommended: extractCoordPoint(recommendedMove),
          isMistake: detail && detail.is_mistake === true,
          selectedRank: selectedCandidateRank,
          showCandidates: showCandidates.checked
        });
        visibleMarkers.forEach(drawBoardMarker);
        updatePointSummary();
      }

      function updatePointSummary() {
        var active = getActiveContext(analysisData);
        var selected = visibleMarkers.find(function (marker) { return marker.selected; });
        var descriptions = visibleMarkers.filter(function (marker) {
          return marker.played || marker.recommended || marker === selected;
        }).map(markerDescription);
        if (active && !extractCoordPoint(active.recommendedMove)) {
          descriptions.push("推荐 " + formatCoord(active.recommendedMove));
        }
        if (active && active.kind !== "current_position" && !extractCoordPoint(active.playedMove)) {
          descriptions.push("实战 " + formatCoord(active.playedMove));
        }
        pointSummary.textContent = descriptions.join("  /  ");
        canvas.setAttribute("aria-label", "围棋棋盘" + (descriptions.length ? "：" + descriptions.join("；") : ""));
      }

      function clickToPoint(event) {
        var rect = canvas.getBoundingClientRect();
        var x = event.clientX - rect.left;
        var y = event.clientY - rect.top;
        var gridX = Math.round((x - boardMetrics.padding) / boardMetrics.cell);
        var gridY = Math.round((y - boardMetrics.padding) / boardMetrics.cell);

        if (gridX < 0 || gridY < 0 || gridX >= BOARD_SIZE || gridY >= BOARD_SIZE) return null;

        var snappedX = boardPoint(gridX);
        var snappedY = boardPoint(gridY);
        var tolerance = boardMetrics.cell * 0.45;

        if (Math.abs(x - snappedX) > tolerance || Math.abs(y - snappedY) > tolerance) return null;

        return { x: gridX, y: gridY };
      }

      canvas.addEventListener("click", function (event) {
        if (isBusy) return;
        var point = clickToPoint(event);
        if (!point) return;
        if (analysisData && trySelectCandidateAtPoint(point)) return;
        if (analysisData) return;
        if (!tryPlaceMove(point, currentColor)) return;

        clearAnalysisState();
        currentColor = oppositeColor(currentColor);
        drawBoard();
        updateStatus();
      });

      undoBtn.addEventListener("click", function () {
        if (!moves.length) return;
        undoLastMove();
        clearAnalysisState();
        currentColor = moves.length % 2 === 0 ? "B" : "W";
        drawBoard();
        updateStatus();
      });

      editBtn.addEventListener("click", function () {
        clearAnalysisState();
        drawBoard();
        updateStatus();
      });
      showCandidates.addEventListener("change", function () {
        if (!showCandidates.checked) selectedCandidateRank = 1;
        drawBoard();
        if (analysisData) renderAnalysisSummary(analysisData);
      });
      showMoveNumbers.addEventListener("change", drawBoard);
      canvas.addEventListener("mousemove", function (event) {
        var point = clickToPoint(event);
        var marker = point && visibleMarkers.find(function (item) { return item.x === point.x && item.y === point.y; });
        canvas.title = marker ? markerDescription(marker) : "";
        canvas.style.cursor = !isBusy && (!analysisData || marker && marker.rank) ? "pointer" : "default";
      });

      clearBtn.addEventListener("click", function () {
        resetBoardState();
        clearAnalysisState();
        drawBoard();
        updateStatus();
      });

      latestBtn.addEventListener("click", function () {
        if (!analysisData) return;
        returnToLatestBoardState();
      });

      prevReviewBtn.addEventListener("click", function () {
        stepReviewPosition(-1);
      });

      nextReviewBtn.addEventListener("click", function () {
        stepReviewPosition(1);
      });

      Array.prototype.forEach.call(analysisViewSwitch.querySelectorAll("[data-analysis-view]"), function (button) {
        button.addEventListener("click", function () {
          setAnalysisView(this.getAttribute("data-analysis-view"));
        });
      });

      analyzeBtn.addEventListener("click", async function () {
        var settings;
        try {
          settings = readGameSettings(true);
        } catch (err) {
          renderErrorState(err.message);
          return;
        }
        setAnalyzeLoadingState(true);

        try {
          clearAnalysisState();
          drawBoard();
          renderLoadingState();
          output.textContent = "分析中...";
          chartMetric = "winrate";

          var payload = {
            board_size: BOARD_SIZE,
            rules: settings.rules,
            komi: settings.komi,
            moves: moves.map(function (m) {
              return {
                color: m.color,
                sgf: m.sgf
              };
            })
          };

          var response = await fetch("/api/v1/analyze-moves", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          var data;
          try {
            data = await response.json();
          } catch (parseErr) {
            data = { error: "Non-JSON response", status: response.status };
          }

          if (!response.ok) {
            var errorMessage = inputErrorMessage(data);
            data = {
              request: payload,
              error: data,
              status: response.status
            };
            renderErrorState(errorMessage);
            renderRawJson(data);
            return;
          }

          applyAnalysisResult(data);
        } catch (err) {
          clearAnalysisState();
          drawBoard();
          renderErrorState("分析失败，请检查后端服务是否启动，并展开原始数据查看详情。");
          renderRawJson({ error: String(err) });
        } finally {
          setAnalyzeLoadingState(false);
        }
      });

      uploadAnalyzeBtn.addEventListener("click", async function () {
        var file = sgfFileInput.files && sgfFileInput.files[0];

        if (!file) {
          setUploadStatus("请选择一个 SGF 文件后再上传。", true);
          return;
        }

        if (file.size > 1024 * 1024) {
          setUploadStatus("SGF 文件不能超过 1 MiB。", true);
          return;
        }
        var settings;
        try {
          settings = readGameSettings(false);
        } catch (err) {
          setUploadStatus(err.message, true);
          return;
        }

        setUploadLoadingState(true);

        try {
          clearAnalysisState();
          drawBoard();
          renderLoadingState();
          output.textContent = "分析中...";
          setUploadStatus("正在上传并分析 SGF 文件，请稍候。", false);

          var formData = new FormData();
          formData.append("file", file);

          var params = new URLSearchParams();
          if (settings.rules !== null) params.set("rules", settings.rules);
          if (settings.komi !== null) params.set("komi", String(settings.komi));
          var response = await fetch("/api/v1/analyze-sgf?" + params.toString(), {
            method: "POST",
            body: formData
          });

          var data;
          try {
            data = await response.json();
          } catch (parseErr) {
            data = { error: "Non-JSON response", status: response.status };
          }

          if (!response.ok) {
            renderErrorState(inputErrorMessage(data));
            renderRawJson({
              file_name: file.name,
              error: data,
              status: response.status
            });
            setUploadStatus(
              "上传分析失败：" + inputErrorMessage(data),
              true
            );
            return;
          }

          rebuildBoardFromTimeline(data.timeline);
          applyAnalysisResult(data);
          var warnings = data.game_summary && data.game_summary.input_warnings || [];
          var resultLabel = data.game_summary && data.game_summary.record_status === "result_recorded"
            ? "棋谱带有结果记录。" : "棋谱未记录结果，可能尚未结束。";
          setUploadStatus("已载入 " + file.name + "。" + resultLabel +
            (warnings.indexOf("first_variation_only") >= 0 ? "包含变化分支，本次仅分析第一条主线。" : ""), false);
        } catch (err) {
          clearAnalysisState();
          resetBoardState();
          drawBoard();
          updateStatus();
          renderErrorState("上传分析失败，请检查后端服务是否启动，并展开原始数据查看详情。");
          renderRawJson({ error: String(err) });
          setUploadStatus("上传分析失败：" + String(err), true);
        } finally {
          setUploadLoadingState(false);
        }
      });

      document.addEventListener("keydown", function (event) {
        if (isBusy || shouldIgnoreReviewKeydown(event) || !analysisData || typeof getViewedMoveNumber() !== "number") return;

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          stepReviewPosition(-1);
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          stepReviewPosition(1);
        }
      });

      window.addEventListener("resize", syncCanvasSize);

      syncCanvasSize();
      updateStatus();
      updateReviewStatus();
      updateReviewNavigationControls();
      syncAnalysisViewButtons();
      setUploadStatus("", false);
    })();
  </script>
</body>
</html>
