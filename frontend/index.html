<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>围棋复盘 MVP 演示</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      line-height: 1.4;
    }

    h1 {
      margin-top: 0;
      font-size: 20px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      align-items: start;
    }

    #board {
      width: min(100%, 640px);
      aspect-ratio: 1 / 1;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: linear-gradient(135deg, #e7c98b, #d7ad63);
      position: relative;
    }

    #board canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 6px 10px;
      border: 1px solid #999;
      background: #f5f5f5;
      cursor: pointer;
    }

    button:hover {
      background: #ececec;
    }

    button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .panel {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 200px;
      background: #fafafa;
    }

    .meta {
      margin: 8px 0;
      font-size: 13px;
      color: #333;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
    }

    .analysis-section {
      margin-top: 12px;
    }

    .analysis-section strong {
      display: block;
      margin-bottom: 4px;
    }

    .analysis-section ul {
      margin: 4px 0 0 18px;
      padding: 0;
    }

    .analysis-section li {
      margin: 2px 0;
    }

    .chart-controls {
      display: flex;
      gap: 8px;
      margin: 6px 0 8px;
      flex-wrap: wrap;
    }

    .chart-controls button {
      padding: 4px 8px;
      font-size: 12px;
    }

    .chart-controls button.active {
      background: #ddd;
    }

    .trend-chart {
      border: 1px solid #ccc;
      background: #fff;
      padding: 6px;
    }

    .trend-chart svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .chart-meta {
      margin-top: 6px;
      font-size: 12px;
      color: #555;
    }

    .loading-state {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      color: #333;
    }

    .loading-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #d9d9d9;
      border-top-color: #666;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex: 0 0 auto;
    }

    .loading-text {
      font-size: 14px;
    }

    .error-message {
      color: #b00020;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    details {
      margin-top: 12px;
    }

    summary {
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!--
    How to run:
    1) Start your FastAPI backend so /api/v1/analyze-moves is available.
       Example (from backend project root): uvicorn app.main:app --reload
    2) Open this file in a browser.
       If direct file:// requests are blocked by your browser for API calls,
       serve this folder with a tiny static server instead, e.g.:
       python3 -m http.server 8080
       then open http://localhost:8080
  -->

  <h1>围棋复盘 MVP - 棋盘演示</h1>

  <div class="layout">
    <div>
      <div id="board">
        <canvas id="boardCanvas" aria-label="围棋棋盘"></canvas>
      </div>

      <div class="controls">
        <button id="undoBtn" type="button">悔棋</button>
        <button id="clearBtn" type="button">清空棋盘</button>
        <button id="analyzeBtn" type="button">开始分析</button>
      </div>

      <div class="meta" id="status">下一手：黑棋 | 手数：0</div>
    </div>

    <div class="panel">
      <strong>分析结果</strong>
      <div id="analysisSummary">暂无分析结果。</div>
      <details>
        <summary>6. 原始分析数据</summary>
        <pre id="analysisOutput">暂无分析数据。</pre>
      </details>
    </div>
  </div>

  <script>
    (function () {
      var boardElement = document.getElementById("board");
      var canvas = document.getElementById("boardCanvas");
      var context = canvas.getContext("2d");
      var summary = document.getElementById("analysisSummary");
      var output = document.getElementById("analysisOutput");
      var status = document.getElementById("status");
      var undoBtn = document.getElementById("undoBtn");
      var clearBtn = document.getElementById("clearBtn");
      var analyzeBtn = document.getElementById("analyzeBtn");
      var BOARD_SIZE = 19;
      var SGF_LETTERS = "abcdefghijklmnopqrstuvwxyz";
      var DISPLAY_COLUMNS = "ABCDEFGHJKLMNOPQRST";
      var STAR_POINTS = [3, 9, 15];
      var moves = [];
      var stonesByPoint = {};
      var currentColor = "B";
      var boardMetrics = null;
      var candidateMarkers = [];
      var chartMetric = "winrate";
      var defaultAnalyzeButtonText = "开始分析";

      function colorName(color) {
        return color === "B" ? "黑棋" : "白棋";
      }

      function toSgf(x, y) {
        return SGF_LETTERS.charAt(x) + SGF_LETTERS.charAt(y);
      }

      function fromSgf(sgf) {
        if (typeof sgf !== "string" || sgf.length !== 2) return null;

        var x = SGF_LETTERS.indexOf(sgf.charAt(0));
        var y = SGF_LETTERS.indexOf(sgf.charAt(1));

        if (x < 0 || y < 0 || x >= BOARD_SIZE || y >= BOARD_SIZE) return null;

        return { x: x, y: y };
      }

      function fromDisplayCoord(display) {
        if (typeof display !== "string") return null;

        var normalized = display.trim().toUpperCase();
        var match = /^([A-HJ-T])\s*(\d{1,2})$/.exec(normalized);
        var x;
        var row;
        var y;

        if (!match) return null;

        x = DISPLAY_COLUMNS.indexOf(match[1]);
        row = Number(match[2]);
        y = BOARD_SIZE - row;

        if (x < 0 || row < 1 || row > BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return null;

        return { x: x, y: y };
      }

      function stoneAt(x, y) {
        return stonesByPoint[pointKey(x, y)] || null;
      }

      function pointKey(x, y) {
        return x + "," + y;
      }

      function oppositeColor(color) {
        return color === "B" ? "W" : "B";
      }

      function neighborsOf(x, y) {
        var neighbors = [];

        if (x > 0) neighbors.push({ x: x - 1, y: y });
        if (x < BOARD_SIZE - 1) neighbors.push({ x: x + 1, y: y });
        if (y > 0) neighbors.push({ x: x, y: y - 1 });
        if (y < BOARD_SIZE - 1) neighbors.push({ x: x, y: y + 1 });

        return neighbors;
      }

      function collectGroup(startX, startY) {
        var startStone = stoneAt(startX, startY);
        var stack;
        var seen;
        var group;
        var liberties;

        if (!startStone) return null;

        stack = [{ x: startX, y: startY }];
        seen = {};
        group = [];
        liberties = {};

        while (stack.length) {
          var point = stack.pop();
          var key = pointKey(point.x, point.y);

          if (seen[key]) continue;
          seen[key] = true;

          var stone = stoneAt(point.x, point.y);
          if (!stone || stone.color !== startStone.color) continue;

          group.push(stone);

          var neighbors = neighborsOf(point.x, point.y);
          for (var i = 0; i < neighbors.length; i++) {
            var neighbor = neighbors[i];
            var neighborStone = stoneAt(neighbor.x, neighbor.y);

            if (!neighborStone) {
              liberties[pointKey(neighbor.x, neighbor.y)] = true;
              continue;
            }

            if (neighborStone.color === startStone.color && !seen[pointKey(neighbor.x, neighbor.y)]) {
              stack.push(neighbor);
            }
          }
        }

        return {
          stones: group,
          libertyCount: Object.keys(liberties).length
        };
      }

      function removeStone(stone) {
        delete stonesByPoint[pointKey(stone.x, stone.y)];
        stone.isCaptured = true;
      }

      function restoreStone(stone) {
        stonesByPoint[pointKey(stone.x, stone.y)] = stone;
        stone.isCaptured = false;
      }

      function tryPlaceMove(point, color) {
        var move;
        var neighbors;
        var capturedStones;
        var seenGroups;

        if (stoneAt(point.x, point.y)) return false;

        move = {
          x: point.x,
          y: point.y,
          color: color,
          sgf: toSgf(point.x, point.y),
          captures: [],
          isCaptured: false
        };
        stonesByPoint[pointKey(point.x, point.y)] = move;

        neighbors = neighborsOf(point.x, point.y);
        capturedStones = [];
        seenGroups = {};

        for (var i = 0; i < neighbors.length; i++) {
          var neighbor = neighbors[i];
          var neighborStone = stoneAt(neighbor.x, neighbor.y);
          var groupInfo;
          var groupKey;
          var j;

          if (!neighborStone || neighborStone.color !== oppositeColor(color)) continue;

          groupKey = pointKey(neighbor.x, neighbor.y);
          if (seenGroups[groupKey]) continue;

          groupInfo = collectGroup(neighbor.x, neighbor.y);
          if (!groupInfo) continue;

          for (j = 0; j < groupInfo.stones.length; j++) {
            seenGroups[pointKey(groupInfo.stones[j].x, groupInfo.stones[j].y)] = true;
          }

          if (groupInfo.libertyCount === 0) {
            for (j = 0; j < groupInfo.stones.length; j++) {
              capturedStones.push(groupInfo.stones[j]);
            }
          }
        }

        for (var k = 0; k < capturedStones.length; k++) {
          removeStone(capturedStones[k]);
        }

        move.captures = capturedStones;

        if (collectGroup(point.x, point.y).libertyCount === 0) {
          delete stonesByPoint[pointKey(point.x, point.y)];
          return false;
        }

        moves.push(move);
        return true;
      }

      function undoLastMove() {
        var move = moves.pop();

        if (!move) return;

        delete stonesByPoint[pointKey(move.x, move.y)];

        for (var i = 0; i < move.captures.length; i++) {
          restoreStone(move.captures[i]);
        }
      }

      function updateStatus() {
        status.textContent = "下一手：" + colorName(currentColor) + " | 手数：" + moves.length;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatCoord(coord) {
        if (!coord) return "暂无";
        if (typeof coord === "string") return coord;
        if (coord.display) return coord.display;
        if (coord.sgf) return coord.sgf;
        return "暂无";
      }

      function extractCoordPoint(coord) {
        if (!coord) return null;

        if (typeof coord === "string") {
          return fromSgf(coord) || fromDisplayCoord(coord);
        }

        return fromSgf(coord.sgf) || fromDisplayCoord(coord.display);
      }

      function getCurrentCandidateMarkers(data) {
        if (!data || typeof data !== "object") return [];

        var current = data.current_position || {};
        var candidates = Array.isArray(current.top_candidates) ? current.top_candidates.slice(0, 3) : [];

        return candidates
          .map(function (candidate, index) {
            var point = extractCoordPoint(candidate && candidate.move);

            if (!point) return null;

            return {
              x: point.x,
              y: point.y,
              rank: index + 1
            };
          })
          .filter(Boolean);
      }

      function playerLabel(color) {
        if (color === "B") return "黑棋";
        if (color === "W") return "白棋";
        return color || "未知";
      }

      function inferPhase(gameSummary) {
        var moveCount = gameSummary && gameSummary.moves_analyzed;

        if (typeof moveCount !== "number") {
          return {
            label: "暂无判断",
            note: "缺少手数信息，暂时无法判断当前阶段。"
          };
        }

        if (moveCount < 40) {
          return {
            label: "布局",
            note: "按当前手数粗略看，仍在布局阶段，重点通常是角边拆挂与全局方向。"
          };
        }

        if (moveCount < 180) {
          return {
            label: "中盘",
            note: "按当前手数粗略看，已进入中盘阶段，重点通常是攻防转换与厚薄处理。"
          };
        }

        return {
          label: "官子",
          note: "按当前手数粗略看，已进入官子阶段，重点通常是收束效率与目数判断。"
        };
      }

      function renderList(items, emptyText, formatter) {
        if (!items || !items.length) {
          return "<div>" + escapeHtml(emptyText) + "</div>";
        }

        return "<ul>" + items.map(function (item, index) {
          return "<li>" + formatter(item, index) + "</li>";
        }).join("") + "</ul>";
      }

      function renderRawJson(data) {
        output.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      }

      function setAnalyzeLoadingState(isLoading) {
        analyzeBtn.disabled = isLoading;
        analyzeBtn.textContent = isLoading ? "分析中…" : defaultAnalyzeButtonText;
      }

      function renderLoadingState() {
        summary.innerHTML = [
          "<div class=\"loading-state\">",
          "<div class=\"loading-spinner\" aria-hidden=\"true\"></div>",
          "<div class=\"loading-text\">正在分析当前局面，请稍候</div>",
          "</div>"
        ].join("");
      }

      function renderErrorState(message) {
        summary.innerHTML = "<div class=\"error-message\">" + escapeHtml(message) + "</div>";
      }

      function hasTrendMetric(timeline, metric) {
        if (!timeline || !timeline.length) return false;

        return timeline.some(function (item) {
          return item && typeof item[metric] === "number";
        });
      }

      function buildTrendSeries(timeline, metric) {
        if (!timeline || !timeline.length) return [];

        return timeline
          .map(function (item) {
            if (!item || typeof item.move_number !== "number" || typeof item[metric] !== "number") {
              return null;
            }

            return {
              moveNumber: item.move_number,
              value: item[metric]
            };
          })
          .filter(Boolean);
      }

      function formatTrendValue(metric, value) {
        if (metric === "winrate") {
          return Math.round(value * 100) + "%";
        }

        var rounded = Math.round(value * 10) / 10;
        return String(rounded);
      }

      function linePath(points) {
        if (!points.length) return "";

        return points.map(function (point, index) {
          return (index === 0 ? "M" : "L") + point.x + " " + point.y;
        }).join(" ");
      }

      function renderTrendChart(timeline) {
        var container = document.getElementById("trendChartSection");
        if (!container) return;

        var hasWinrate = hasTrendMetric(timeline, "winrate_after");
        var hasScore = hasTrendMetric(timeline, "score_after");
        var activeMetric = chartMetric;
        var series;
        var minValue;
        var maxValue;
        var width;
        var height;
        var padding;
        var points;
        var path;
        var axisLabels;
        var firstPoint;
        var lastPoint;

        if (!hasWinrate && !hasScore) {
          container.innerHTML = "<div>暂无可绘制的走势数据。</div>";
          return;
        }

        if (activeMetric === "winrate" && !hasWinrate) activeMetric = "score";
        if (activeMetric === "score" && !hasScore) activeMetric = "winrate";
        chartMetric = activeMetric;

        series = buildTrendSeries(timeline, activeMetric === "winrate" ? "winrate_after" : "score_after");
        if (!series.length) {
          container.innerHTML = "<div>暂无可绘制的走势数据。</div>";
          return;
        }

        minValue = series[0].value;
        maxValue = series[0].value;
        for (var i = 1; i < series.length; i++) {
          minValue = Math.min(minValue, series[i].value);
          maxValue = Math.max(maxValue, series[i].value);
        }

        if (minValue === maxValue) {
          minValue -= activeMetric === "winrate" ? 0.02 : 1;
          maxValue += activeMetric === "winrate" ? 0.02 : 1;
        }

        width = 300;
        height = 160;
        padding = { top: 12, right: 12, bottom: 28, left: 36 };
        points = series.map(function (item, index) {
          var x;
          var y;
          var xSpan = Math.max(1, series.length - 1);
          var ySpan = maxValue - minValue;

          x = padding.left + ((width - padding.left - padding.right) * index) / xSpan;
          y = padding.top + ((height - padding.top - padding.bottom) * (maxValue - item.value)) / ySpan;

          return {
            x: Math.round(x * 10) / 10,
            y: Math.round(y * 10) / 10,
            moveNumber: item.moveNumber,
            value: item.value
          };
        });
        path = linePath(points);
        axisLabels = [
          formatTrendValue(activeMetric, maxValue),
          formatTrendValue(activeMetric, (minValue + maxValue) / 2),
          formatTrendValue(activeMetric, minValue)
        ];
        firstPoint = points[0];
        lastPoint = points[points.length - 1];

        container.innerHTML = [
          "<div class=\"chart-controls\">",
          hasWinrate ? "<button type=\"button\" data-chart-metric=\"winrate\" class=\"" + (activeMetric === "winrate" ? "active" : "") + "\">胜率</button>" : "",
          hasScore ? "<button type=\"button\" data-chart-metric=\"score\" class=\"" + (activeMetric === "score" ? "active" : "") + "\">目差</button>" : "",
          "</div>",
          "<div class=\"trend-chart\">",
          "<svg viewBox=\"0 0 " + width + " " + height + "\" role=\"img\" aria-label=\"走势折线图\">",
          "<line x1=\"" + padding.left + "\" y1=\"" + padding.top + "\" x2=\"" + padding.left + "\" y2=\"" + (height - padding.bottom) + "\" stroke=\"#999\" stroke-width=\"1\" />",
          "<line x1=\"" + padding.left + "\" y1=\"" + (height - padding.bottom) + "\" x2=\"" + (width - padding.right) + "\" y2=\"" + (height - padding.bottom) + "\" stroke=\"#999\" stroke-width=\"1\" />",
          "<line x1=\"" + padding.left + "\" y1=\"" + (padding.top + (height - padding.top - padding.bottom) / 2) + "\" x2=\"" + (width - padding.right) + "\" y2=\"" + (padding.top + (height - padding.top - padding.bottom) / 2) + "\" stroke=\"#ddd\" stroke-width=\"1\" />",
          "<path d=\"" + path + "\" fill=\"none\" stroke=\"#2f6db3\" stroke-width=\"2\" />",
          points.map(function (point) {
            return "<circle cx=\"" + point.x + "\" cy=\"" + point.y + "\" r=\"3\" fill=\"#2f6db3\"><title>第" + point.moveNumber + "手: " + formatTrendValue(activeMetric, point.value) + "</title></circle>";
          }).join(""),
          "<text x=\"6\" y=\"" + (padding.top + 4) + "\" font-size=\"10\" fill=\"#555\">" + escapeHtml(axisLabels[0]) + "</text>",
          "<text x=\"6\" y=\"" + (padding.top + (height - padding.top - padding.bottom) / 2 + 4) + "\" font-size=\"10\" fill=\"#555\">" + escapeHtml(axisLabels[1]) + "</text>",
          "<text x=\"6\" y=\"" + (height - padding.bottom + 4) + "\" font-size=\"10\" fill=\"#555\">" + escapeHtml(axisLabels[2]) + "</text>",
          "<text x=\"" + firstPoint.x + "\" y=\"" + (height - 8) + "\" text-anchor=\"middle\" font-size=\"10\" fill=\"#555\">第" + firstPoint.moveNumber + "手</text>",
          (lastPoint.moveNumber !== firstPoint.moveNumber
            ? "<text x=\"" + lastPoint.x + "\" y=\"" + (height - 8) + "\" text-anchor=\"middle\" font-size=\"10\" fill=\"#555\">第" + lastPoint.moveNumber + "手</text>"
            : ""),
          "</svg>",
          "</div>",
          "<div class=\"chart-meta\">",
          escapeHtml(activeMetric === "winrate" ? "显示每手实战后胜率走势。" : "显示每手实战后目差走势。"),
          " 共 " + escapeHtml(String(series.length)) + " 个点。",
          "</div>"
        ].join("");

        Array.prototype.forEach.call(container.querySelectorAll("[data-chart-metric]"), function (button) {
          button.addEventListener("click", function () {
            chartMetric = this.getAttribute("data-chart-metric");
            renderTrendChart(timeline);
          });
        });
      }

      function renderAnalysisSummary(data) {
        if (!data || typeof data !== "object") {
          summary.textContent = "暂无分析结果。";
          return;
        }

        var current = data.current_position || {};
        var gameSummary = data.game_summary || {};
        var keyPoints = data.key_points || {};
        var turningPoints = keyPoints.turning_points || [];
        var planBreaks = keyPoints.plan_breaks || [];
        var reviewSummary = keyPoints.review_summary || {};
        var candidates = (current.top_candidates || []).slice(0, 3);
        var currentPhase = inferPhase(gameSummary);
        var bestMoveLabel = formatCoord(current.best_move);
        var hasBestMove = bestMoveLabel !== "暂无";
        var timeline = Array.isArray(data.timeline) ? data.timeline : [];
        var keyPointItems = [];

        if (turningPoints.length) {
          keyPointItems = keyPointItems.concat(turningPoints.slice(0, 2).map(function (item) {
            return "转折点，第" + item.move_number + "手：" + (item.summary || "暂无说明");
          }));
        }

        if (planBreaks.length) {
          keyPointItems = keyPointItems.concat(planBreaks.slice(0, 2).map(function (item) {
            return "计划断点，第" + item.break_move_number + "手：" + (item.summary || "暂无说明");
          }));
        }

        if (reviewSummary.summary) {
          keyPointItems.push("阶段总结：" + reviewSummary.summary);
        }

        summary.innerHTML = [
          "<div class=\"analysis-section\">",
          "<strong>1. 当前局面</strong>",
          "<ul>",
          "<li>轮到谁下：" + escapeHtml(playerLabel(current.next_player)) + "</li>",
          "<li>当前推荐点：" + escapeHtml(hasBestMove ? bestMoveLabel : "暂无推荐点") + "</li>",
          "<li>推荐状态：" + escapeHtml(hasBestMove ? "棋盘上已标出当前推荐点。" : "当前局面没有可用的推荐点，棋盘不会显示推荐标记。") + "</li>",
          "<li>当前一句话说明：" + escapeHtml(current.short_explanation || "暂无说明") + "</li>",
          "</ul>",
          "</div>",
          "<div class=\"analysis-section\">",
          "<strong>2. 候选点</strong>",
          renderList(candidates, "暂无候选点。", function (candidate, index) {
            return (
              (index + 1) +
              ". " +
              escapeHtml(formatCoord(candidate.move)) +
              "，胜率约" +
              escapeHtml(String(Math.round((candidate.winrate || 0) * 100))) +
              "%，目差预计为" +
              escapeHtml(String(candidate.score_estimate))
            );
          }),
          "</div>",
          "<div class=\"analysis-section\">",
          "<strong>3. 阶段判断</strong>",
          "<ul>",
          "<li>当前属于：" + escapeHtml(currentPhase.label) + "</li>",
          "<li>简短说明：" + escapeHtml(currentPhase.note) + "</li>",
          "</ul>",
          "</div>",
          "<div class=\"analysis-section\">",
          "<strong>4. 走势</strong>",
          "<div id=\"trendChartSection\">暂无走势数据。</div>",
          "</div>",
          "<div class=\"analysis-section\">",
          "<strong>5. 关键点</strong>",
          renderList(keyPointItems, "暂无明显转折点或计划断点。", function (item) {
            return escapeHtml(item);
          }),
          "</div>"
        ].join("");

        renderTrendChart(timeline);
      }

      function syncCanvasSize() {
        var rect = boardElement.getBoundingClientRect();
        var size = Math.min(640, Math.floor(rect.width || boardElement.clientWidth || 640));
        var ratio = window.devicePixelRatio || 1;
        canvas.width = size * ratio;
        canvas.height = size * ratio;
        canvas.style.width = size + "px";
        canvas.style.height = size + "px";
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        boardMetrics = {
          size: size,
          padding: size * 0.075,
          cell: (size - size * 0.15) / (BOARD_SIZE - 1)
        };
        drawBoard();
      }

      function boardPoint(index) {
        return boardMetrics.padding + index * boardMetrics.cell;
      }

      function drawGrid() {
        context.strokeStyle = "#5d3c1a";
        context.lineWidth = 1;

        for (var i = 0; i < BOARD_SIZE; i++) {
          var pos = boardPoint(i);
          var start = boardPoint(0);
          var end = boardPoint(BOARD_SIZE - 1);

          context.beginPath();
          context.moveTo(start, pos);
          context.lineTo(end, pos);
          context.stroke();

          context.beginPath();
          context.moveTo(pos, start);
          context.lineTo(pos, end);
          context.stroke();
        }
      }

      function drawStarPoints() {
        context.fillStyle = "#5d3c1a";

        for (var y = 0; y < STAR_POINTS.length; y++) {
          for (var x = 0; x < STAR_POINTS.length; x++) {
            context.beginPath();
            context.arc(boardPoint(STAR_POINTS[x]), boardPoint(STAR_POINTS[y]), Math.max(3, boardMetrics.cell * 0.1), 0, Math.PI * 2);
            context.fill();
          }
        }
      }

      function drawStone(move, moveNumber, isLatestMove) {
        var x = boardPoint(move.x);
        var y = boardPoint(move.y);
        var radius = boardMetrics.cell * 0.45;
        var gradient = context.createRadialGradient(x - radius * 0.35, y - radius * 0.35, radius * 0.1, x, y, radius);
        var label = String(moveNumber);

        if (move.color === "B") {
          gradient.addColorStop(0, "#666");
          gradient.addColorStop(1, "#111");
        } else {
          gradient.addColorStop(0, "#fff");
          gradient.addColorStop(1, "#d8d8d8");
        }

        context.fillStyle = gradient;
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fill();
        context.strokeStyle = move.color === "B" ? "#000" : "#999";
        context.stroke();

        if (isLatestMove) {
          context.save();
          context.strokeStyle = move.color === "B" ? "#f5d36b" : "#b85c00";
          context.lineWidth = Math.max(2, boardMetrics.cell * 0.08);
          context.beginPath();
          context.arc(x, y, radius * 0.78, 0, Math.PI * 2);
          context.stroke();
          context.restore();
        }

        context.save();
        context.fillStyle = move.color === "B" ? "#f4f4f4" : "#111";
        context.font = "bold " + Math.max(10, Math.floor(radius * (label.length > 2 ? 0.9 : 1.1))) + "px sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(label, x, y + 0.5);
        context.restore();
      }

      function candidateMarkerStyle(rank) {
        if (rank === 1) {
          return {
            outerStroke: "#1f7a3d",
            innerStroke: "rgba(232, 247, 237, 0.98)",
            dotFill: "#1f7a3d",
            ringScale: 0.52,
            lineWidth: 0.085
          };
        }

        if (rank === 2) {
          return {
            outerStroke: "#43a35f",
            innerStroke: "rgba(239, 250, 242, 0.96)",
            dotFill: "#43a35f",
            ringScale: 0.45,
            lineWidth: 0.07
          };
        }

        return {
          outerStroke: "#7bc98f",
          innerStroke: "rgba(247, 253, 248, 0.94)",
          dotFill: "#7bc98f",
          ringScale: 0.39,
          lineWidth: 0.06
        };
      }

      function drawCandidateMarker(point) {
        var x = boardPoint(point.x);
        var y = boardPoint(point.y);
        var stone = stoneAt(point.x, point.y);
        var style = candidateMarkerStyle(point.rank);
        var ringRadius = boardMetrics.cell * (stone ? Math.max(0.5, style.ringScale) : style.ringScale);
        var dotRadius = boardMetrics.cell * 0.1;

        context.save();
        context.strokeStyle = style.outerStroke;
        context.lineWidth = Math.max(2, boardMetrics.cell * style.lineWidth);
        context.beginPath();
        context.arc(x, y, ringRadius, 0, Math.PI * 2);
        context.stroke();

        context.strokeStyle = style.innerStroke;
        context.lineWidth = Math.max(2, boardMetrics.cell * 0.04);
        context.beginPath();
        context.arc(x, y, ringRadius - Math.max(3, boardMetrics.cell * 0.08), 0, Math.PI * 2);
        context.stroke();

        context.fillStyle = style.dotFill;
        context.beginPath();
        context.arc(x, y, dotRadius, 0, Math.PI * 2);
        context.fill();
        context.restore();
      }

      function drawBoard() {
        var activeMoves = [];
        var i;

        if (!boardMetrics) return;

        context.clearRect(0, 0, boardMetrics.size, boardMetrics.size);
        context.fillStyle = "#ddb56d";
        context.fillRect(0, 0, boardMetrics.size, boardMetrics.size);
        drawGrid();
        drawStarPoints();

        for (i = 0; i < moves.length; i++) {
          if (!moves[i].isCaptured) {
            activeMoves.push({
              move: moves[i],
              moveNumber: i + 1
            });
          }
        }

        for (i = 0; i < activeMoves.length; i++) {
          drawStone(activeMoves[i].move, activeMoves[i].moveNumber, i === activeMoves.length - 1);
        }

        for (i = 0; i < candidateMarkers.length; i++) {
          drawCandidateMarker(candidateMarkers[i]);
        }
      }

      function clickToPoint(event) {
        var rect = canvas.getBoundingClientRect();
        var x = event.clientX - rect.left;
        var y = event.clientY - rect.top;
        var gridX = Math.round((x - boardMetrics.padding) / boardMetrics.cell);
        var gridY = Math.round((y - boardMetrics.padding) / boardMetrics.cell);

        if (gridX < 0 || gridY < 0 || gridX >= BOARD_SIZE || gridY >= BOARD_SIZE) return null;

        var snappedX = boardPoint(gridX);
        var snappedY = boardPoint(gridY);
        var tolerance = boardMetrics.cell * 0.45;

        if (Math.abs(x - snappedX) > tolerance || Math.abs(y - snappedY) > tolerance) return null;

        return { x: gridX, y: gridY };
      }

      canvas.addEventListener("click", function (event) {
        var point = clickToPoint(event);
        if (!point) return;
        if (!tryPlaceMove(point, currentColor)) return;

        candidateMarkers = [];
        currentColor = oppositeColor(currentColor);
        drawBoard();
        updateStatus();
      });

      undoBtn.addEventListener("click", function () {
        if (!moves.length) return;
        undoLastMove();
        candidateMarkers = [];
        currentColor = moves.length % 2 === 0 ? "B" : "W";
        drawBoard();
        updateStatus();
      });

      clearBtn.addEventListener("click", function () {
        moves = [];
        stonesByPoint = {};
        currentColor = "B";
        candidateMarkers = [];
        drawBoard();
        summary.textContent = "暂无分析结果。";
        output.textContent = "暂无分析数据。";
        chartMetric = "winrate";
        updateStatus();
      });

      analyzeBtn.addEventListener("click", async function () {
        setAnalyzeLoadingState(true);

        try {
          candidateMarkers = [];
          drawBoard();
          renderLoadingState();
          output.textContent = "分析中...";
          chartMetric = "winrate";

          var payload = {
            board_size: BOARD_SIZE,
            komi: 6.5,
            moves: moves.map(function (m) {
              return {
                color: m.color,
                sgf: m.sgf
              };
            })
          };

          var response = await fetch("http://127.0.0.1:8000/api/v1/analyze-moves", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          var data;
          try {
            data = await response.json();
          } catch (parseErr) {
            data = { error: "Non-JSON response", status: response.status };
          }

          if (!response.ok) {
            data = {
              request: payload,
              error: data,
              status: response.status
            };
            renderErrorState("分析失败，请展开原始数据查看详情。");
            renderRawJson(data);
            return;
          }

          candidateMarkers = getCurrentCandidateMarkers(data);
          drawBoard();
          renderAnalysisSummary(data);
          renderRawJson(data);
        } catch (err) {
          candidateMarkers = [];
          drawBoard();
          renderErrorState("分析失败，请检查后端服务是否启动，并展开原始数据查看详情。");
          renderRawJson({ error: String(err) });
        } finally {
          setAnalyzeLoadingState(false);
        }
      });

      window.addEventListener("resize", syncCanvasSize);

      syncCanvasSize();
      updateStatus();
    })();
  </script>
</body>
</html>
