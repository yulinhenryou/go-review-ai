<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="api-base" content="" />
  <title>围棋复盘 · 本地工作台</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-stones" aria-hidden="true"></span><h1>围棋复盘</h1></div>
    <span class="workspace-label">本地工作台 <span class="version">M4</span></span>
  </header>

  <section class="input-bar" aria-label="棋谱输入">
    <div class="upload-controls">
      <input id="sgfFileInput" type="file" accept=".sgf,application/x-go-sgf,text/plain" aria-label="选择 SGF 文件" />
      <button id="uploadAnalyzeBtn" type="button"><img src="./icons/upload.svg" alt="" /><span>导入棋谱</span></button>
    </div>
    <div class="game-settings">
      <label for="rulesInput">规则
        <select id="rulesInput">
          <option value="custom">自定义</option>
          <option value="chinese">中国规则</option>
          <option value="japanese">日韩规则</option>
        </select>
      </label>
      <label for="komiInput">贴目
        <input id="komiInput" type="number" min="-150" max="150" step="0.5" inputmode="decimal" />
      </label>
      <label id="customRulesLabel" for="customRulesInput">计分方式
        <select id="customRulesInput">
          <option value="chinese">中国数子</option>
          <option value="japanese">日韩数目</option>
        </select>
      </label>
    </div>
  </section>
  <div class="meta upload-status" id="uploadStatus" role="status"></div>

  <main class="layout">
    <section class="board-column" aria-label="棋盘工作区">
      <div class="board-toolbar">
        <span class="meta" id="status">下一手：黑棋 | 手数：0</span>
        <div class="display-options">
          <label><input id="showCandidates" type="checkbox" checked />候选点</label>
          <label><input id="showMoveNumbers" type="checkbox" />手数</label>
        </div>
      </div>
      <div class="board-meta">
        <div class="review-meta" id="reviewStatus" aria-live="polite"></div>
        <div class="board-legend" aria-label="棋盘标记图例">
          <span><i class="legend-actual" aria-hidden="true"></i>实战</span>
          <span><i class="legend-played" aria-hidden="true">!</i>失误</span>
          <span><i class="legend-best" aria-hidden="true"></i>推荐</span>
          <span><i class="legend-candidate" aria-hidden="true">2</i>候选</span>
        </div>
      </div>
      <div id="board">
        <canvas id="boardCanvas" aria-label="围棋棋盘"></canvas>
      </div>
      <div id="boardPointSummary" class="point-summary" aria-live="polite"></div>
      <div class="board-footer">
        <div class="controls">
          <button id="passBtn" type="button">停一手</button>
          <button id="undoBtn" type="button" class="icon-button" aria-label="悔棋" title="悔棋"><img src="./icons/undo-2.svg" alt="" /></button>
          <button id="clearBtn" type="button" class="icon-button" aria-label="清空棋盘" title="清空棋盘"><img src="./icons/trash-2.svg" alt="" /></button>
          <button id="editBtn" type="button" class="icon-button" aria-label="继续录入" title="继续录入" hidden><img src="./icons/pencil.svg" alt="" /></button>
          <button id="analyzeBtn" type="button" class="primary"><img src="./icons/scan-line.svg" alt="" /><span>预览分析</span></button>
        </div>
        <div class="review-nav" aria-label="复盘导航">
          <button id="prevReviewBtn" type="button" class="icon-button" aria-label="上一步" title="上一步" disabled><img src="./icons/chevron-left.svg" alt="" /></button>
          <span id="moveCounter" class="move-counter">0 / 0</span>
          <button id="nextReviewBtn" type="button" class="icon-button" aria-label="下一步" title="下一步" disabled><img src="./icons/chevron-right.svg" alt="" /></button>
          <button id="latestBtn" type="button" class="icon-button" aria-label="回到最新局面" title="回到最新局面" disabled><img src="./icons/skip-forward.svg" alt="" /></button>
        </div>
      </div>
    </section>

    <aside class="panel" aria-label="复盘报告">
      <div class="panel-heading"><h2>复盘报告</h2><span class="engine-label">KataGo</span></div>
      <section id="inputPreview" class="input-preview" aria-label="棋谱预览" hidden>
        <h3>确认棋谱</h3>
        <dl id="previewDetails"></dl>
        <div id="playerFields" class="player-fields" hidden>
          <label>黑方名称<input id="blackPlayer" type="text" maxlength="256" /></label>
          <label>白方名称<input id="whitePlayer" type="text" maxlength="256" /></label>
        </div>
        <p id="previewWarnings" class="quality-notes"></p>
        <div class="preview-actions">
          <button id="confirmBtn" type="button" class="primary">确认并分析</button>
          <button id="backToInputBtn" type="button">继续录入</button>
        </div>
      </section>
      <section id="jobPanel" class="job-panel" aria-label="分析任务" hidden>
        <div id="jobStatus" role="status" aria-live="polite"></div>
        <progress id="jobProgress" max="1" value="0" aria-label="已分析局面"></progress>
        <div class="preview-actions">
          <button id="cancelJobBtn" type="button">取消分析</button>
          <button id="retryJobBtn" type="button" hidden>重试</button>
        </div>
      </section>
      <div class="view-switch" id="analysisViewSwitch" aria-label="分析视图切换">
        <button id="currentViewBtn" type="button" class="active" data-analysis-view="current">当前局面</button>
        <button id="reviewViewBtn" type="button" data-analysis-view="review">整盘复盘</button>
      </div>
      <div id="analysisSummary"><div class="empty-state">暂无分析结果</div></div>
      <details class="raw-data">
        <summary>原始分析数据</summary>
        <pre id="analysisOutput">暂无分析数据。</pre>
      </details>
    </aside>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
