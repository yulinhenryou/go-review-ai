[project]
# Distribution name only: it must equal "slug" in config/project.json.
# The import package is the brand-free `weiqi` (DECISIONS ADR-P01).
name = "fupan"
version = "0.0.0"
description = "Go (Weiqi / Baduk) game review: a diagnosis and a training plan from your own games."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    # The Rust rules core (crates/weiqi-py), built from source by uv.
    "weiqi-core",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "weiqi"

[tool.uv.sources]
weiqi-core = { path = "../crates/weiqi-py" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
