[workspace]
resolver = "3"
members = ["crates/weiqi-core", "crates/weiqi-py"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
