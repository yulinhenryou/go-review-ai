name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version, components and targets.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # weiqi-py's build script needs an interpreter at least as new as its
      # abi3-py314 floor.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # A short, time-boxed run on every push; longer runs are local and recorded
  # in docs/acceptance. A crash fails the job and libFuzzer prints the input.
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/weiqi-core/fuzz
    steps:
      - uses: actions/checkout@v7
      # fuzz/rust-toolchain.toml selects nightly, which libFuzzer needs.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/weiqi-core/fuzz
      - run: cargo install cargo-fuzz@0.13.2 --locked
      - run: cargo fuzz build
      # The SGF targets start from the public corpus. `game` reads bytes as
      # moves, so SGF seeds only make its inputs long and slow; it starts empty.
      - name: Fuzz each target for 30 seconds
        run: |
          for target in decode parse round_trip game; do
            mkdir -p "corpus/$target"
            seeds=../../../testdata/sgf
            if [ "$target" = game ]; then seeds=; fi
            cargo fuzz run "$target" "corpus/$target" $seeds -- -max_total_time=30
          done

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      # uv builds the weiqi-core wheel from crates/weiqi-py with maturin and
      # installs it, so the tests import the compiled module, not sources.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m mypy.stubtest weiqi_core --allowlist ../crates/weiqi-py/stubtest-allowlist.txt
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The prototype must stay green until it is removed at the end of M4.
  legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv venv --python 3.14 .venv
      - run: uv pip install --python .venv/bin/python -c constraints.txt -e '.[api,dev]'
      # Live KataGo cases stay opt-in (RUN_KATAGO_INTEGRATION) and are skipped here.
      - run: .venv/bin/python -m pytest -q -ra
      - run: node --test tests/frontend/*.test.mjs
